<!DOCTYPE html>
<!--
  System-adaptive: tokens.css is dark-first with a prefers-color-scheme:light
  fallback. The head script is THEME_BOOTSTRAP_SCRIPT from
  @revealui/presentation: it stamps data-theme from rvui-theme (or the OS)
  before first paint so a stored light/dark preference does not flash.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default shell SEO matches technical homepage (HOME_HERO L1). Non-technical
         audience head is applied client-side via useAudienceHead when ?for=non-technical. -->
    <title>RevealUI | The agentic business runtime startups operate on their own domain.</title>
    <meta name="description" content="Technical founders and small agencies who already run agents — existing tools report in, you keep the stack. Powerful and safe: agents leave receipts when it matters, and the catalog matches checkout (Free / Pro $49 / Max $99/mo · $799/yr). Open source. Start free." />
    <meta name="keywords" content="open source, self-hostable, business runtime, auth, offers, payments, billing, admin dashboard, AI agents, MCP, Stripe, RevealUI, open-model" />
    <meta name="author" content="RevealUI Studio" />
    <link rel="canonical" href="https://revealui.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#060d1a" />
    <script>
      (function(){try{var k="rvui-theme";var s=localStorage.getItem(k);var t=(s==='light'||s==='dark'||s==='system')?s:'system';var r=t==='system'?(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;document.documentElement.setAttribute("data-theme",r);}catch(e){document.documentElement.setAttribute("data-theme",window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}})();
    </script>
    <!-- Fonts are self-hosted via @fontsource-variable/* (imported in
         app/entry.client.tsx). No third-party font host is referenced here:
         the CSP in vercel.json (font-src 'self' data:) blocks external font
         CDNs, so a hosted Google Fonts link would be dead weight. -->
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RevealUI | The agentic business runtime startups operate on their own domain." />
    <meta property="og:description" content="Technical founders and small agencies who already run agents — existing tools report in, you keep the stack. Powerful and safe: agents leave receipts when it matters, and the catalog matches checkout (Free / Pro $49 / Max $99/mo · $799/yr). Open source. Start free." />
    <meta property="og:url" content="https://revealui.com" />
    <meta property="og:site_name" content="RevealUI" />
    <meta property="og:image" content="https://revealui.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RevealUI | The agentic business runtime startups operate on their own domain." />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RevealUI | The agentic business runtime startups operate on their own domain." />
    <meta name="twitter:description" content="Technical founders and small agencies who already run agents — existing tools report in, you keep the stack. Powerful and safe: agents leave receipts when it matters, and the catalog matches checkout (Free / Pro $49 / Max $99/mo · $799/yr). Open source. Start free." />
    <meta name="twitter:image" content="https://revealui.com/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/entry.client.tsx"></script>
  </body>
</html>
