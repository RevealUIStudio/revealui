<!DOCTYPE html>
<!--
  System-adaptive: the marketing site follows the visitor's OS color scheme via
  @revealui/presentation/tokens.css (dark-first :root + prefers-color-scheme:light
  media query). Every section now uses adaptive semantic tokens (bg-background,
  text-foreground, text-muted-foreground, …), so no data-theme lock is needed.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default shell SEO matches technical homepage (HOME_HERO L1). Non-technical
         audience head is applied client-side via useAudienceHead when ?for=non-technical. -->
    <title>RevealUI | Build it once. Every product after starts ahead.</title>
    <meta name="description" content="Self-hosted business runtime: People, Content, Offers, Payments, and Agents under one roof. Open source. Open-model first. Start free." />
    <meta name="keywords" content="open source, self-hostable, business runtime, auth, content, payments, billing, admin dashboard, AI agents, MCP, Stripe, RevealUI, open-model" />
    <meta name="author" content="RevealUI Studio" />
    <link rel="canonical" href="https://revealui.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#060d1a" />
    <!-- Fonts are self-hosted via @fontsource-variable/* (imported in
         app/entry.client.tsx). No third-party font host is referenced here:
         the CSP in vercel.json (font-src 'self' data:) blocks external font
         CDNs, so a hosted Google Fonts link would be dead weight. -->
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RevealUI | Build it once. Every product after starts ahead." />
    <meta property="og:description" content="Self-hosted business runtime: People, Content, Offers, Payments, and Agents under one roof. Open source. Open-model first. Start free." />
    <meta property="og:url" content="https://revealui.com" />
    <meta property="og:site_name" content="RevealUI" />
    <meta property="og:image" content="https://revealui.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RevealUI | Build it once. Every product after starts ahead." />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RevealUI | Build it once. Every product after starts ahead." />
    <meta name="twitter:description" content="Self-hosted business runtime: People, Content, Offers, Payments, and Agents under one roof. Open source. Open-model first. Start free." />
    <meta name="twitter:image" content="https://revealui.com/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/entry.client.tsx"></script>
  </body>
</html>
