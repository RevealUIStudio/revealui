  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^25.9.4
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.3
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/ui': ^4.1.10
  bcryptjs: ^3.0.3
