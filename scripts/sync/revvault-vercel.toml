# revvault → Vercel sync manifest
#
# Drives `revvault sync vercel --manifest scripts/sync/revvault-vercel.toml`
# (default path; the pnpm scripts in package.json point at this file).
#
# Schema:
#   - [projects.<slug>]       — one block per Vercel project
#   - project_id              — Vercel project ID (prj_...)
#   - vault_prefix            — fallback vault path namespace; vars not listed
#                               in [projects.<slug>.vars] are read from
#                               <vault_prefix>/<VAR_NAME>
#   - targets                 — Vercel envs to sync; production-only in v1
#                               per Q4 (preview + development deferred)
#   - skip                    — Vercel var names sync intentionally never touches
#                               (e.g. STRIPE_LIVE_MODE per Q3 — Vercel-direct
#                               deployment toggle, not a credential)
#   - [projects.<slug>.vars]  — per-var path overrides (UPPER_SNAKE → vault path);
#                               lets multiple Vercel vars feed from one canonical
#                               kebab path (e.g. POSTGRES_URL + DATABASE_URL both
#                               read from revealui/prod/db/postgres-url).
#                               Entries may be inline tables:
#                                 NAME = { path = "...", shape = "...", sensitive = true }
#                               `sensitive = true` requests Vercel type `sensitive`
#                               on CREATE — the plaintext is never revealable in
#                               the Vercel UI/API after write; use for credentials
#                               (Stripe keys, webhook secrets, signing/JWT
#                               secrets). Updates PATCH value-only and never
#                               change an existing row's type. Independent of the
#                               marker, revvault >= 0.3.0 also preserves
#                               sensitivity on re-create whenever any remote row
#                               of the same key is already sensitive.
#
# Owner-ratified conventions: see the internal canonical env-var mapping doc
# Design doc: internal revvault-vercel sync design (private coordination hub)
# Requires revvault >= 0.3.0 (sensitive markers + preserve-on-recreate; older
# binaries fail loudly on the inline `sensitive` key — by design) and PR #40
# (per-var path overrides via `vars` table)

# Personal account — no team_id needed (Vercel team is implicit via the token)

# ── revealui-api ────────────────────────────────────────────────────────────
[projects.revealui-api]
project_id = "prj_zk6EQijYXwd9L7BccuBssi436ktM"
vault_prefix = "revealui/vercel/api"
targets = ["production"]
skip = [
  # NODE_ENV is platform-managed, never user-touched
  "NODE_ENV",
  # STRIPE_LIVE_MODE is a Vercel-direct deployment toggle (Q3 owner exception)
  "STRIPE_LIVE_MODE",
  # REVEALUI_WORKER_HEALTH_URL (GAP-443) is a plain URL, not a secret, so it
  # has no revvault path; set it Vercel-direct on this project only. It is
  # the target the /api/cron/worker-liveness probe hits and is deliberately
  # never hardcoded or vault-mirrored — this is a public repo and the value
  # discloses the Fly worker's hostname.
  "REVEALUI_WORKER_HEALTH_URL",
]

[projects.revealui-api.vars]
# Stripe — keys + secrets (sensitive: never UI/API-revealable after write)
STRIPE_SECRET_KEY              = { path = "revealui/prod/stripe/secret-key", sensitive = true }
STRIPE_WEBHOOK_SECRET          = { path = "revealui/prod/stripe/webhook-secret", sensitive = true }
STRIPE_WEBHOOK_SECRET_LIVE     = { path = "revealui/prod/stripe/webhook-secret-live", sensitive = true }
# STRIPE_WEBHOOK_SECRET_PREVIOUS deferred — rotation slot, populated only
# during webhook-secret rotation. Re-add to manifest at that time.
STRIPE_AGENT_METER_EVENT_NAME  = "revealui/prod/stripe/agent-meter-event-name"

# Stripe — price IDs (literal, low-secrecy)
STRIPE_PRO_PRICE_ID                  = "revealui/prod/stripe/pro-price-id"
STRIPE_MAX_PRICE_ID                  = "revealui/prod/stripe/max-price-id"
STRIPE_ENTERPRISE_PRICE_ID           = "revealui/prod/stripe/enterprise-price-id"
STRIPE_PERPETUAL_PRO_PRICE_ID        = "revealui/prod/stripe/perpetual-pro-price-id"
STRIPE_PERPETUAL_MAX_PRICE_ID        = "revealui/prod/stripe/perpetual-max-price-id"
STRIPE_PERPETUAL_ENTERPRISE_PRICE_ID = "revealui/prod/stripe/perpetual-enterprise-price-id"
STRIPE_RENEWAL_PRO_PRICE_ID          = "revealui/prod/stripe/renewal-pro-price-id"
STRIPE_RENEWAL_MAX_PRICE_ID          = "revealui/prod/stripe/renewal-max-price-id"
STRIPE_RENEWAL_ENTERPRISE_PRICE_ID   = "revealui/prod/stripe/renewal-enterprise-price-id"
STRIPE_CREDITS_STARTER_PRICE_ID      = "revealui/prod/stripe/credits-starter-price-id"
STRIPE_CREDITS_STANDARD_PRICE_ID     = "revealui/prod/stripe/credits-standard-price-id"
STRIPE_CREDITS_SCALE_PRICE_ID        = "revealui/prod/stripe/credits-scale-price-id"
STRIPE_AGENT_OVERAGE_PRICE_ID        = "revealui/prod/stripe/agent-overage-price-id"
STRIPE_PRO_ANNUAL_PRICE_ID           = "revealui/prod/stripe/pro-annual-price-id"
STRIPE_MAX_ANNUAL_PRICE_ID           = "revealui/prod/stripe/max-annual-price-id"
STRIPE_ENTERPRISE_ANNUAL_PRICE_ID    = "revealui/prod/stripe/enterprise-annual-price-id"

# Observability — Sentry (server-side error capture; required by validate-startup.ts
# REQUIRED_IN_PRODUCTION_HOSTED per revealui#787)
SENTRY_DSN = "revealui/prod/sentry/dsn"

# Admin API key (parity with admin)
REVEALUI_ADMIN_API_KEY = { path = "revealui/prod/admin/api-key", sensitive = true }

# Database
POSTGRES_URL = { path = "revealui/prod/db/postgres-url", sensitive = true }
DATABASE_URL = { path = "revealui/prod/db/postgres-url", sensitive = true }

# Encryption + signing
REVEALUI_KEK                = { path = "revealui/prod/kek", sensitive = true }
# REVEALUI_KEK_NEXT deferred — rotation slot, populated only during KEK
# rotation. Re-add to manifest at that time.
# Canonical license-signing keypair (Ed25519). The retired
# revealui/prod/license/* path held the stale pre-cutover RSA pair.
REVEALUI_LICENSE_PRIVATE_KEY = { path = "revdev/license-signing-private-key", sensitive = true }
REVEALUI_LICENSE_PUBLIC_KEY  = "revdev/license-signing-public-key"
REVEALUI_AUDIT_SIGNING_KEY   = { path = "revealui/prod/audit/signing-private-key", sensitive = true }
REVEALUI_AUDIT_PUBLIC_KEY    = "revealui/prod/audit/signing-public-key"
REVEALUI_SECRET              = { path = "revealui/prod/secret", sensitive = true }

# Visual edit sessions — HMAC secret for read-only preview tokens
REVEALUI_PREVIEW_TOKEN_SECRET = { path = "revealui/prod/preview-token-secret", sensitive = true }

# Cron + alerting
REVEALUI_CRON_SECRET = { path = "revealui/prod/cron-secret", sensitive = true }
REVEALUI_ALERT_EMAIL = "revealui/prod/alert-email"

# Storage — Cloudflare R2 (canonical, S3-compatible). All five set together.
R2_ACCOUNT_ID         = "revealui/prod/r2/account-id"
R2_ACCESS_KEY_ID      = { path = "revealui/prod/r2/access-key-id", sensitive = true }
R2_SECRET_ACCESS_KEY  = { path = "revealui/prod/r2/secret-access-key", sensitive = true }
R2_BUCKET             = "revealui/prod/r2/bucket"
R2_PUBLIC_BASE_URL    = "revealui/prod/r2/public-base-url"
# REVEALUI_NPM_TOKEN dropped 2026-05-23: 2FA-bypass npm automation token retired
# (revealui#1016); release.yml publishes via OIDC trusted publishing — no token.

# Email transport (Gmail SA)
GOOGLE_SERVICE_ACCOUNT_EMAIL = "revealui/prod/google/service-account-email"
GOOGLE_PRIVATE_KEY            = { path = "revealui/prod/google/private-key", sensitive = true }
EMAIL_FROM                    = "revealui/prod/email/from"
EMAIL_REPLY_TO                = "revealui/prod/email/reply-to"

# Auth + session
PASSKEY_ORIGIN         = "revealui/prod/passkey/origin"
PASSKEY_RP_ID          = "revealui/prod/passkey/rp-id"
PASSKEY_RP_NAME        = "revealui/prod/passkey/rp-name"
SESSION_COOKIE_DOMAIN  = "revealui/prod/session-cookie-domain"
CORS_ORIGIN            = "revealui/prod/cors-origin"
# REVEALUI_CORS_ORIGINS dropped 2026-05-09: code falls back to CORS_ORIGIN
# when unset. Re-add when admin/api actually need separate cross-origin config.

# Marketplace
MARKETPLACE_CONNECT_RETURN_URL = "revealui/prod/marketplace-connect-return-url"

# Billing (Stripe customer-portal config id; consumed by apps/server/src/routes/billing.ts)
REVEALUI_BILLING_PORTAL_CONFIG_ID = "revealui/prod/stripe/billing-portal-config-id"

# Electric (real-time sync)
ELECTRIC_SERVICE_URL = "revealui/prod/electric/service-url"
ELECTRIC_SECRET      = { path = "revealui/prod/electric/secret", sensitive = true }

# Public (bundled into client; not secret, kept canonical for reproducibility)
NEXT_PUBLIC_SERVER_URL     = "revealui/prod/public/server-url"
REVEALUI_PUBLIC_SERVER_URL = "revealui/prod/public/server-url"
# Self origin for governed MCP tool loopback (credentialsProvider → REST).
# Missing on api caused live tool calls to fail while /api/mcp auth still
# returned 400 Session ID required (auth green, tools dead). Same vault leaf
# as admin/marketing NEXT_PUBLIC_API_URL / REVEALUI_API_URL.
REVEALUI_API_URL           = "revealui/prod/public/api-url"
NEXT_PUBLIC_API_URL        = "revealui/prod/public/api-url"


# ── revealui-admin ──────────────────────────────────────────────────────────
[projects.revealui-admin]
project_id = "prj_7sEFDg4MH6C26nJPjrukK86QdwfG"
vault_prefix = "revealui/vercel/admin"
targets = ["production"]
skip = [
  "NODE_ENV",
  # Next.js telemetry opt-out — platform-managed, not a credential
  "NEXT_TELEMETRY_DISABLED",
  # Drop in Q7 — the third "is live" synonym; admin code migrating to
  # NEXT_PUBLIC_IS_LIVE. Keeping in skip means existing Vercel value is
  # not tracked by sync and will surface as an Orphan until removed.
  "REVEALUI_PUBLIC_STRIPE_IS_TEST_KEY",
]

[projects.revealui-admin.vars]
# Stripe — keys (parity with api; sensitive: never UI/API-revealable after write)
STRIPE_SECRET_KEY     = { path = "revealui/prod/stripe/secret-key", sensitive = true }
STRIPE_WEBHOOK_SECRET = { path = "revealui/prod/stripe/webhook-secret", sensitive = true }

# Stripe — publishable key (admin-side client SDK)
NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "revealui/prod/stripe/publishable-key"

# Stripe — price IDs (parity twins; same canonical paths as api)
NEXT_PUBLIC_STRIPE_PRO_PRICE_ID        = "revealui/prod/stripe/pro-price-id"
NEXT_PUBLIC_STRIPE_MAX_PRICE_ID        = "revealui/prod/stripe/max-price-id"
NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID = "revealui/prod/stripe/enterprise-price-id"
NEXT_PUBLIC_STRIPE_PRO_ANNUAL_PRICE_ID        = "revealui/prod/stripe/pro-annual-price-id"
NEXT_PUBLIC_STRIPE_MAX_ANNUAL_PRICE_ID        = "revealui/prod/stripe/max-annual-price-id"
NEXT_PUBLIC_STRIPE_ENTERPRISE_ANNUAL_PRICE_ID = "revealui/prod/stripe/enterprise-annual-price-id"
NEXT_PUBLIC_STRIPE_PRO_PERPETUAL_PRICE_ID        = "revealui/prod/stripe/perpetual-pro-price-id"
NEXT_PUBLIC_STRIPE_MAX_PERPETUAL_PRICE_ID        = "revealui/prod/stripe/perpetual-max-price-id"
NEXT_PUBLIC_STRIPE_ENTERPRISE_PERPETUAL_PRICE_ID = "revealui/prod/stripe/perpetual-enterprise-price-id"
# Bare versions on admin (server-side reads in Next.js api routes; same values)
STRIPE_MAX_PRICE_ID        = "revealui/prod/stripe/max-price-id"
STRIPE_PRO_ANNUAL_PRICE_ID        = "revealui/prod/stripe/pro-annual-price-id"
STRIPE_MAX_ANNUAL_PRICE_ID        = "revealui/prod/stripe/max-annual-price-id"
STRIPE_ENTERPRISE_ANNUAL_PRICE_ID = "revealui/prod/stripe/enterprise-annual-price-id"

# Database
POSTGRES_URL  = { path = "revealui/prod/db/postgres-url", sensitive = true }
NEON_API_KEY  = { path = "revealui/prod/db/neon-api-key", sensitive = true }

# Encryption + signing (parity with api — same license keypair + session secret)
# REVEALUI_KEK - field-level encryption key (AES-256-GCM; packages/db/src/crypto.ts).
# admin's production instrumentation hard-requires it (apps/admin/src/lib/utils/env-validation.ts);
# leaving it untracked here is what let it go missing when the prod env was rebuilt (regression #928).
REVEALUI_KEK                 = { path = "revealui/prod/kek", sensitive = true }
REVEALUI_LICENSE_PRIVATE_KEY = { path = "revdev/license-signing-private-key", sensitive = true }
REVEALUI_LICENSE_PUBLIC_KEY  = "revdev/license-signing-public-key"
REVEALUI_AUDIT_SIGNING_KEY   = { path = "revealui/prod/audit/signing-private-key", sensitive = true }
REVEALUI_AUDIT_PUBLIC_KEY    = "revealui/prod/audit/signing-public-key"
REVEALUI_SECRET              = { path = "revealui/prod/secret", sensitive = true }

# Auth — passkey / WebAuthn (admin serves the passkey ceremony at admin.revealui.com)
# rp-id=revealui.com is the registrable parent of admin.revealui.com; origin must match the admin origin.
# Required in prod: packages/auth/src/server/passkey.ts asserts rpId!=='localhost' and 500s without these.
PASSKEY_ORIGIN         = "revealui/prod/passkey/origin"
PASSKEY_RP_ID          = "revealui/prod/passkey/rp-id"
PASSKEY_RP_NAME        = "revealui/prod/passkey/rp-name"

# Cron + alerting (parity with api)
REVEALUI_CRON_SECRET = { path = "revealui/prod/cron-secret", sensitive = true }

# Storage — Cloudflare R2 (canonical, S3-compatible). All five set together.
R2_ACCOUNT_ID         = "revealui/prod/r2/account-id"
R2_ACCESS_KEY_ID      = { path = "revealui/prod/r2/access-key-id", sensitive = true }
R2_SECRET_ACCESS_KEY  = { path = "revealui/prod/r2/secret-access-key", sensitive = true }
R2_BUCKET             = "revealui/prod/r2/bucket"
R2_PUBLIC_BASE_URL    = "revealui/prod/r2/public-base-url"

# Email transport (parity with api — same Gmail SA credentials)
EMAIL_FROM                   = "revealui/prod/email/from"
EMAIL_REPLY_TO               = "revealui/prod/email/reply-to"
GOOGLE_PRIVATE_KEY           = { path = "revealui/prod/google/private-key", sensitive = true }
GOOGLE_SERVICE_ACCOUNT_EMAIL = "revealui/prod/google/service-account-email"

# Auth + session (parity with api)
SESSION_COOKIE_DOMAIN = "revealui/prod/session-cookie-domain"

# Electric (parity with api — same realtime sync infrastructure)
ELECTRIC_SECRET      = { path = "revealui/prod/electric/secret", sensitive = true }
ELECTRIC_SERVICE_URL = "revealui/prod/electric/service-url"

# Mode flags (canonical pair — kept post-Q7)
NEXT_PUBLIC_IS_LIVE = "revealui/prod/public/is-live"

# Public URLs (parity twins across api/admin/marketing)
NEXT_PUBLIC_API_URL        = "revealui/prod/public/api-url"
REVEALUI_API_URL           = "revealui/prod/public/api-url"
NEXT_PUBLIC_SERVER_URL     = "revealui/prod/public/server-url"
REVEALUI_PUBLIC_SERVER_URL = "revealui/prod/public/server-url"

# Observability — Sentry (Next.js admin; DSN is client-bundled via NEXT_PUBLIC_,
# auth-token + org + project are build-time for source-map upload via withSentryConfig)
NEXT_PUBLIC_SENTRY_DSN = "revealui/prod/sentry/dsn-admin"
SENTRY_AUTH_TOKEN      = { path = "revealui/prod/sentry/auth-token", sensitive = true }
SENTRY_ORG             = "revealui/prod/sentry/org"
SENTRY_PROJECT         = "revealui/prod/sentry/project-admin"

# Admin-specific (no parity — kebab paths under admin/ for consistency with secrets.md)
REVEALUI_ADMIN_EMAIL         = "revealui/prod/admin/email"
REVEALUI_ADMIN_PASSWORD      = { path = "revealui/prod/admin/password", sensitive = true }
REVEALUI_ADMIN_API_KEY       = { path = "revealui/prod/admin/api-key", sensitive = true }


# ── revealui-marketing ──────────────────────────────────────────────────────
