# ── revealui-docs ───────────────────────────────────────────────────────────
[projects.revealui-docs]
project_id = "prj_OPwr0FrgcK17AOBCyoj4JIilJ9S1"
vault_prefix = "revealui/vercel/docs"
targets = ["production"]
# docs site has zero prod env vars at audit time (2026-05-09); preview env
