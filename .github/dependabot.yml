version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group all development dependencies together
      devDependencies:
        patterns:
          - "@types/*"
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "@biomejs/*"
          - "typescript"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      # Production deps split into reviewable groups so a single weekly run
      # produces ~5 tractable PRs instead of one 43-update mega-PR (see #785/
      # #795/#797 — closed/recreated three times because the batch was too
      # large to fix the one inevitable broken test without owner triage).
      production-frontend:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@next/*"
          - "lexical"
          - "@lexical/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "vite"
          - "@vitejs/*"
          - "postcss"
          - "three"
        update-types:
          - "minor"
          - "patch"
      production-server:
        patterns:
          - "hono"
          - "@hono/*"
          - "drizzle-orm"
          - "@neondatabase/*"
          - "pg"
          - "jose"
          - "lru-cache"
        update-types:
          - "minor"
          - "patch"
      production-billing-and-observability:
        patterns:
          - "stripe"
          - "@sentry/*"
          - "swagger-ui-dist"
        update-types:
          - "minor"
          - "patch"
      production-tooling:
        patterns:
          - "turbo"
          - "syncpack"
          - "semver"
          - "zod"
          - "ora"
          - "@clack/*"
          - "react-hook-form"
        update-types:
          - "minor"
          - "patch"
      production-electric-sql:
        patterns:
          - "@electric-sql/*"
        update-types:
          - "minor"
          - "patch"
    # Separate security updates (always create individual PRs)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Allow automatic rebasing
    rebase-strategy: "auto"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    groups:
      actions:
        patterns:
          - "*"

  # Monitor Docker base images (ignore non-LTS Node major bumps)
  - package-ecosystem: "docker"
    directory: "/apps/admin"
    schedule:
      interval: "monthly"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/docs"
    schedule:
      interval: "monthly"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/marketing"
    schedule:
      interval: "monthly"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
