name: Client Name Leak Scan

# Job name preserved for rulesets.
# The scanner that decides pass or fail is the base commit's copy. The tree
# it reads is the pull request merge, or the pushed commit. A change to
# scripts/check-client-leaks.sh cannot grade itself.

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  scan:
    name: Client / prospect name leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout tree to scan
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: scan-tree

      - name: Checkout trusted scanner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/check-client-leaks.sh
          sparse-checkout-cone-mode: false
          path: trusted-scanner

      - name: Scan the changes with the trusted scanner
        run: bash trusted-scanner/scripts/check-client-leaks.sh scan-tree
