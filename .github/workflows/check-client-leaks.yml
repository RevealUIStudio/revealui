on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

permissions:
  contents: read

jobs:
  scan:
    name: Client / prospect name leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: RevealUIStudio/.github/.github/actions/check-client-leaks@650b8dcaa4be7d21768a0d3f47ebb9437768d156
