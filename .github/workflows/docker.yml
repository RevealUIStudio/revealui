name: Build & Push Forge Docker Images

# Builds Forge Docker images (API + Admin) and pushes to GHCR.
# Triggered manually from GitHub Actions UI.
#
# Images are tagged with:
#   - :latest (only when dispatched from main — avoids a feature/test-branch run
#     clobbering the :latest tag that self-hosted kits track)
#   - :sha-<short-sha> (immutable, for pinning)
#   - :v<version> (if a version input is provided)
# Each image also gets SLSA provenance + SBOM attestations pushed to GHCR
# (supply-chain parity with the npm --provenance release flow).
#
# PR runs (GAP-328 work item 2): pull_request builds are verification-only —
# no GHCR login, no push, no provenance/SBOM. The pull_request trigger carries
# no path filter on purpose: the `Docker images` summary context is a REQUIRED
# check, and a workflow-level path filter would leave unrelated PRs stuck on
# "Expected". Path scoping happens in the `changes` job instead.
#
# The required context is the non-matrix `docker-images` summary job, NOT the
# per-app Build jobs: a matrix job skipped at the job level never expands its
# matrix, so GitHub reports one check literally named "Build ${{ matrix.app }}"
# and the expanded contexts sit on "Expected" forever. The summary job always
# runs, passes on build success or skip, and fails on any build failure.

on:
  push:
    branches: [test, main]
    paths:
      - apps/admin/**
      - apps/server/**
      - packages/ai/**
      - packages/auth/**
      - packages/cache/**
      - packages/config/**
      - packages/contracts/**
      - packages/core/**
      - packages/db/**
      - packages/dev/**
      - packages/mcp/**
      - packages/openapi/**
      - packages/paywall/**
      - packages/presentation/**
      - packages/resilience/**
      - packages/router/**
      - packages/security/**
      - packages/services/**
      - packages/setup/**
      - packages/sync/**
      - packages/tokens/**
      - packages/utils/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - .github/workflows/docker.yml
      - .github/actions/setup-pnpm-node/**
  pull_request:
    branches: [test, main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 0.5.0) — optional, defaults to SHA only"
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  # Per-ref groups so PR verification builds don't queue behind branch pushes.
  # Pushes keep cancel-in-progress off (never kill a half-published matrix);
  # superseded PR builds are safe to cancel.
  group: docker-forge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/revealuistudio

jobs:
  # PR-only path scoping. Push events keep the workflow-level `paths:` filter;
  # PR events always run this cheap job, and the build matrix is skipped when
  # the diff touches nothing in the image build graph (a skipped job still
  # satisfies the required Build server/admin/migrate checks).
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Diff against the PR base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker=false
          while IFS= read -r f; do
            # Keep this prefix list in lockstep with the on.push.paths filter.
            case "$f" in
              apps/admin/*|apps/server/*|packages/ai/*|packages/auth/*|packages/cache/*|packages/config/*|packages/contracts/*|packages/core/*|packages/db/*|packages/dev/*|packages/mcp/*|packages/openapi/*|packages/paywall/*|packages/presentation/*|packages/resilience/*|packages/router/*|packages/security/*|packages/services/*|packages/setup/*|packages/sync/*|packages/tokens/*|packages/utils/*|package.json|pnpm-lock.yaml|turbo.json|.github/workflows/docker.yml|.github/actions/setup-pnpm-node/*)
                docker=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA"...HEAD)
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.app }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile.forge
            image: revealui-api
          - app: admin
            dockerfile: apps/admin/Dockerfile.forge
            image: revealui-admin
          # One-shot DB migrate image for self-hosted kits (built from the
          # `migrate` stage of the server Dockerfile). The kit compose runs it
          # once before api+admin so a fresh volume gets its schema.
          - app: migrate
            dockerfile: apps/server/Dockerfile.forge
            target: migrate
            image: revealui-migrate

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Empty for server/admin (builds the final `runner` stage); `migrate`
          # for the one-shot migrate image. Empty target = final stage.
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain parity with npm provenance: push SLSA provenance + SBOM
          # attestations to GHCR alongside each image. PR verification builds
          # skip both (nothing is published).
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

  # The REQUIRED status context. Always runs (if: always()), so it reports on
  # every PR regardless of path scoping: success when the build matrix
  # succeeded or was skipped as image-irrelevant, failure on any build
  # failure or cancellation. Required-checks live on this single context
  # because skipped matrix jobs never expand into their per-app contexts.
  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build-and-push]
    if: always()
    steps:
      - name: Evaluate build matrix result
        env:
          RESULT: ${{ needs.build-and-push.result }}
        run: |
          case "$RESULT" in
            success) echo "image builds green" ;;
            skipped) echo "image-irrelevant diff, builds skipped" ;;
            *)
              echo "build-and-push result: $RESULT"
              exit 1
              ;;
          esac
