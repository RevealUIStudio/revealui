name: Build & Push Forge Docker Images

# Builds Forge Docker images (API + Admin) and pushes to GHCR.
# Triggered manually from GitHub Actions UI.
#
# Images are tagged with:
#   - :latest (always)
#   - :sha-<short-sha> (immutable, for pinning)
#   - :v<version> (if a version input is provided)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 0.5.0) — optional, defaults to SHA only"
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-forge
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/revealuistudio

jobs:
  build-and-push:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile.forge
            image: revealui-api
          - app: admin
            dockerfile: apps/admin/Dockerfile.forge
            image: revealui-admin
          # One-shot DB migrate image for self-hosted kits (built from the
          # `migrate` stage of the server Dockerfile). The kit compose runs it
          # once before api+admin so a fresh volume gets its schema.
          - app: migrate
            dockerfile: apps/server/Dockerfile.forge
            target: migrate
            image: revealui-migrate

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Empty for server/admin (builds the final `runner` stage); `migrate`
          # for the one-shot migrate image. Empty target = final stage.
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
