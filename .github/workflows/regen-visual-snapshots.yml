name: Regenerate Visual Snapshots

# Manual workflow to regenerate Playwright visual snapshots.
#
# When admin UI or docs showcase chrome changes intentionally, the stored PNGs
# under e2e/__snapshots__/ go stale and the matching CI job starts failing (or
# cancelling at timeout). Re-running locally risks font hinting / headless GPU
# compositing mismatches. This workflow runs the regen on the same Ubuntu +
# Playwright/Chromium pinned versions that ci.yml e2e-visual and ds.yml
# showcase visual-regression use.
#
# Usage:
#   1. Open Actions → "Regenerate Visual Snapshots" → "Run workflow"
#   2. Pick a base branch (defaults to `test`) and a suite (`all`, `admin`,
#      or `showcase`).
#   3. Workflow checks out, builds the apps that suite needs, runs Playwright
#      with --update-snapshots, and pushes any changed PNGs to a fresh branch
#      `chore/snapshot-regen-<run_id>`.
#   4. The workflow output prints the branch name and a `gh pr create` URL.
#      Open the PR, eyeball the snapshot diffs, merge it into the base branch.
#
# The new branch is the merge target — branch protection on `test`/`main`
# prevents direct push, and snapshot diffs deserve a human eyeball pass anyway.

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Branch to regenerate snapshots from (and PR back to)'
        required: true
        default: 'test'
      suite:
        description: 'Which goldens to regenerate'
        type: choice
        options:
          - all
          - admin
          - showcase
        default: all

permissions:
  contents: write

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.28.2
  PNPM_INSTALL_FLAGS: --frozen-lockfile

jobs:
  regen:
    name: Regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build apps for suite
        env:
          SKIP_ENV_VALIDATION: "true"
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            admin) pnpm --filter admin... build ;;
            showcase) pnpm --filter docs... build ;;
            *) pnpm build ;;
          esac

      - name: Start Admin server
        if: inputs.suite != 'showcase'
        run: pnpm --filter admin start &
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Wait for Admin
        if: inputs.suite != 'showcase'
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:4000 > /dev/null 2>&1 && echo "Admin ready" && break || \
            echo "Waiting for Admin... ($i/40)" && sleep 3
          done
          curl -sf http://localhost:4000 > /dev/null 2>&1 || \
            (echo "::error::Admin failed to start within 120s" && exit 1)

      - name: Regenerate admin visual snapshots
        if: inputs.suite != 'showcase'
        run: npx playwright test --project=chromium e2e/visual-snapshots.e2e.ts --update-snapshots
        env:
          CI: "true"
          SKIP_ENV_VALIDATION: "true"
        continue-on-error: true

      - name: Start docs preview server
        if: inputs.suite != 'admin'
        run: pnpm --filter docs preview --port 3002 &

      - name: Wait for docs
        if: inputs.suite != 'admin'
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:3002 > /dev/null 2>&1 && echo "Docs ready" && break || \
            echo "Waiting for docs... ($i/40)" && sleep 3
          done
          curl -sf http://localhost:3002 > /dev/null 2>&1 || \
            (echo "::error::Docs app failed to start within 120s" && exit 1)

      - name: Regenerate showcase visual snapshots
        if: inputs.suite != 'admin'
        run: npx playwright test --project=chromium e2e/showcase-visual.e2e.ts --update-snapshots
        env:
          CI: "true"
          DOCS_BASE_URL: "http://localhost:3002"
        continue-on-error: true

      - name: Push regenerated snapshots to a new branch
        run: |
          # Noreply identity required for Verified SSH-signed commits (GAP-327).
          # founder@revealui.com has no user account to verify against after org conversion.
          git config user.name "RevealUI Studio"
          git config user.email "43050008+joshua-v-dev@users.noreply.github.com"
          if [[ -z "$(git status --short e2e/__snapshots__/)" ]]; then
            echo "::notice::No snapshot changes detected — visual baseline already matches CI rendering"
            exit 0
          fi
          BRANCH="chore/snapshot-regen-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add e2e/__snapshots__/
          git -c core.fileMode=false commit -m "test(e2e): regenerate visual snapshots from ${{ inputs.base_branch }}"
          git push origin "$BRANCH"
          echo "::notice::Regenerated snapshots pushed to $BRANCH"
          echo "::notice::Open a PR: gh pr create --base ${{ inputs.base_branch }} --head $BRANCH --title 'test(e2e): regenerate visual snapshots'"

      - name: Upload snapshot artifact (always, for review)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: regenerated-snapshots
          path: e2e/__snapshots__/
          retention-days: 14
