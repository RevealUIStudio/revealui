name: Dependabot Catalog Lockfile Auto-Fix

# Dependabot sometimes writes a resolved version into pnpm-lock.yaml where the
# importer specifier should stay `catalog:`. `pnpm install --frozen-lockfile`
# then fails until the lockfile is regenerated from the workspace catalog.
#
# This workflow regenerates that lockfile and, when it changed, writes
# pnpm-lock.yaml back with a GitHub App installation token. An API write is
# signed by GitHub, so the require-signed-commits ruleset accepts it. An App
# token also re-triggers pull_request workflows. The default GITHUB_TOKEN would
# not.
#
# Trust boundary:
# - pull_request_target uses this file from the base branch.
# - The job runs only when the pull request author is dependabot[bot] and the
#   head repository is the base repository. Who triggered the event is not the
#   check.
# - Checkout uses the head commit SHA, persist-credentials: false, and no
#   token. The App token is minted only after install, and only the lockfile
#   write step receives it.
# - Install uses --lockfile-only, --ignore-scripts, and --ignore-pnpmfile.
#   pnpmfile hooks are moved aside. node-options and script-shell lines are
#   removed from .npmrc before install.
# - If the head commit already carries the autofix subject and the lockfile
#   still drifts, the job fails instead of writing again.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: dependabot-catalog-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  AUTOFIX_SUBJECT: "fix(deps): restore catalog specifiers in pnpm-lock.yaml"
  npm_config_ignore_scripts: "true"
  npm_config_ignore_pnpmfile: "true"

jobs:
  autofix:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    name: Restore catalog specifiers in lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse credential headers in git config
        run: |
          set -euo pipefail
          if git config --list | grep -F -q 'extraheader='; then
            echo "::error::git config contains a credential header. Checkout must not persist a token."
            exit 1
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Hold project hooks that can execute during install
        run: |
          set -euo pipefail
          for hook in pnpmfile.cjs .pnpmfile.cjs pnpmfile.js .pnpmfile.js pnpmfile.mjs .pnpmfile.mjs; do
            if [ -f "$hook" ]; then
              mv "$hook" "$RUNNER_TEMP/held-$hook"
            fi
          done
          if [ -f .npmrc ]; then
            tmp="$RUNNER_TEMP/npmrc-sanitized"
            : > "$tmp"
            while IFS= read -r line || [ -n "$line" ]; do
              trimmed=$(printf '%s' "$line" | tr -d '[:space:]')
              lower=$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')
              case "$lower" in
                node-options*|*node-options*|script-shell*|*script-shell*|ignore-scripts*|*ignore-scripts*|ignore-pnpmfile*|*ignore-pnpmfile*)
                  continue
                  ;;
              esac
              printf '%s\n' "$line" >> "$tmp"
            done < .npmrc
            mv "$tmp" .npmrc
          fi

      - name: Regenerate lockfile entries from manifests
        run: pnpm install --lockfile-only --ignore-scripts --ignore-pnpmfile

      - name: Detect lockfile drift
        id: drift
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lockfile already matches manifests. No fix needed."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Lockfile drift detected."
            git --no-pager diff --stat -- pnpm-lock.yaml
          fi

      - name: Stop if this head is already an autofix commit
        if: steps.drift.outputs.drifted == 'true'
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [ "$subject" = "$AUTOFIX_SUBJECT" ]; then
            echo "::error::Lockfile still drifts after a catalog autofix commit. Refusing another write."
            exit 1
          fi

      - name: Mint backflow App token
        id: app-token
        if: steps.drift.outputs.drifted == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BACKFLOW_APP_ID }}
          private-key: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit catalog specifier fix (signed via GitHub API)
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse HEAD)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::error::Checkout SHA does not match the pull request head. Refusing to write."
            exit 1
          fi
          base64 -w0 pnpm-lock.yaml > /tmp/lock.b64
          blob_sha=$(git rev-parse "HEAD:pnpm-lock.yaml")
          jq -n \
            --arg message "$AUTOFIX_SUBJECT" \
            --rawfile content /tmp/lock.b64 \
            --arg sha "$blob_sha" \
            --arg branch "$BRANCH" \
            '{message:$message, content:($content|rtrimstr("\n")), sha:$sha, branch:$branch}' > /tmp/lockfix.json
          gh api --method PUT "repos/${{ github.repository }}/contents/pnpm-lock.yaml" --input /tmp/lockfix.json >/dev/null
          echo "::notice::Committed catalog specifier fix via the GitHub API to ${BRANCH}"
