name: Dependabot Catalog Lockfile Auto-Fix

# When Dependabot bumps a catalog-managed dependency, it sometimes replaces
# `specifier: 'catalog:'` in the pnpm-lock.yaml importer block with the
# resolved version (e.g. `specifier: 8.21.0`), even though
# `pnpm-workspace.yaml`'s catalog was correctly bumped. The resulting
# importer entry no longer matches the manifest, so
# `pnpm install --frozen-lockfile` rejects it with
# ERR_PNPM_OUTDATED_LOCKFILE — breaking every Quality / Security / CodeQL
# job until a human checks out the branch and runs `pnpm install`.
#
# This workflow runs that one-line fix automatically:
#   1. Triggers only on Dependabot PRs that touched pnpm-lock.yaml.
#   2. Checks out the PR head branch.
#   3. Runs `pnpm install --lockfile-only --ignore-scripts`, which
#      regenerates importer specifiers back to 'catalog:' against the
#      already-correct workspace catalog.
#   4. If the lockfile drifted, commits the fix to the PR head via the
#      GitHub Contents API using a GitHub App installation token (the
#      revfleet-backflow App), NOT GITHUB_TOKEN. An API commit is signed by
#      GitHub's web-flow key ("Verified"), so it satisfies the
#      require-signed-commits ruleset; a local `git push` was unsigned and
#      left every catalog-touching Dependabot PR blocked.
#
# Why a GitHub App token instead of GITHUB_TOKEN: a push made with the
# default GITHUB_TOKEN does NOT trigger `pull_request` /
# `pull_request_target` workflows (GitHub loop-prevention). A GITHUB_TOKEN
# push therefore left the corrected lockfile permanently "stale red" —
# ci.yml never re-ran on the fix, so the PR kept showing the pre-fix
# failure (or "no checks reported on the branch") and needed a manual
# nudge (close/reopen, empty commit) to validate. Pushing with the App
# installation token fires the `synchronize` event normally, so ci.yml
# re-runs and the PR gets a real green check on the autofixed head.
#
# Push-loop guard: the App-token push DOES re-trigger this workflow, but
# the re-triggered run's `github.actor` is the App's bot identity (not
# dependabot[bot]), so the `if: github.actor == 'dependabot[bot]'` job
# guard short-circuits it — no second fix, no loop. That same push re-runs
# ci.yml under a non-dependabot actor, which is exactly the CI run we want.
#
# Security: `pull_request_target` runs with the BASE branch's workflow
# definition, so a PR can't modify this workflow to escalate privileges.
# The job only runs for the dependabot[bot] actor (which an external PR
# cannot spoof), and `pnpm install --ignore-scripts` skips lifecycle
# scripts so a malicious package.json change can't execute arbitrary code.
# The App token is minted per-run, scoped to `contents: write` on this
# repo only, and expires within ~1h.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'pnpm-lock.yaml'

# GITHUB_TOKEN stays read-only: every write (the lockfile-fix push) goes
# through the scoped, short-lived App installation token minted in the job.
permissions:
  contents: read

concurrency:
  group: dependabot-catalog-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"

jobs:
  autofix:
    if: github.actor == 'dependabot[bot]'
    name: Restore catalog specifiers in lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # Mint a GitHub App installation token so the lockfile-fix push
      # re-fires CI (a GITHUB_TOKEN push would be loop-suppressed — see the
      # header comment). Scoped to contents:write on this repo only. The
      # BACKFLOW_APP_ID / BACKFLOW_APP_PRIVATE_KEY secrets + the
      # revfleet-backflow App installation are shared with
      # backflow-main-into-test.yml.
      - name: Mint backflow App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BACKFLOW_APP_ID }}
          private-key: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout PR head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Regenerate lockfile entries from manifests
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Detect lockfile drift
        id: drift
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lockfile already matches manifests — no fix needed"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Lockfile drift detected — committing fix"
            git --no-pager diff --stat pnpm-lock.yaml
          fi

      # Commit the lockfile fix through the GitHub Contents API (NOT a local
      # `git push`). A commit created via the API with the App installation
      # token is signed by GitHub's web-flow key and lands "Verified", so it
      # satisfies the `require-signed-commits` ruleset — a plain
      # `git commit && git push` produced an UNSIGNED commit that the ruleset
      # rejected, leaving every catalog-touching Dependabot PR blocked. The
      # App-token write still fires the `synchronize` event (re-running ci.yml
      # on the fixed head) and the push-loop guard above still short-circuits
      # the re-triggered autofix run.
      - name: Commit catalog specifier fix (signed via GitHub API)
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          base64 -w0 pnpm-lock.yaml > /tmp/lock.b64
          sha="$(gh api "repos/${{ github.repository }}/contents/pnpm-lock.yaml?ref=${BRANCH}" --jq .sha)"
          jq -n \
            --arg message "fix(deps): restore catalog specifiers in pnpm-lock.yaml" \
            --rawfile content /tmp/lock.b64 \
            --arg sha "$sha" \
            --arg branch "$BRANCH" \
            '{message:$message, content:($content|rtrimstr("\n")), sha:$sha, branch:$branch}' > /tmp/lockfix.json
          gh api --method PUT "repos/${{ github.repository }}/contents/pnpm-lock.yaml" --input /tmp/lockfix.json >/dev/null
          echo "::notice::Committed catalog-specifier fix via GitHub API (signed) to ${BRANCH}"
