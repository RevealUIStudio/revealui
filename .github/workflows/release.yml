name: Release OSS Packages

# Publishes OSS packages to npm with OIDC trusted publishing (no long-lived NPM_TOKEN).
# Provenance attestations (SLSA Build Level 2) are generated via --provenance.
#
# Prerequisites (one-time setup):
#   1. Configure trusted publishing on npmjs.org for each OSS package:
#      Package Settings > Publishing > Trusted Publishers > Add GitHub Actions
#      Repository: RevealUIStudio/revealui, Workflow: release.yml
#   2. No NPM_TOKEN secret is needed — OIDC handles authentication.
#
# Trigger: manually from GitHub Actions UI (Actions > Release OSS Packages > Run workflow)
# Changesets must already be applied (pnpm changeset version committed to main).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — build and preview without publishing"
        type: boolean
        default: false

permissions:
  contents: write # push tags, create GitHub releases
  id-token: write # OIDC token for npm provenance (SLSA B2)

concurrency:
  group: release-oss
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  # CI runners must not execute dev-machine git hooks: the husky pre-push gate
  # fired on the "Push tags" step (run 27389106334) and ran the full repo gate
  # inside the release runner — an environment the admin test suite was never
  # provisioned for — blocking the tag push AFTER packages had already
  # published. Husky honors HUSKY=0 by skipping hook install + execution.
  HUSKY: "0"

jobs:
  release:
    name: Publish OSS to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish

    steps:
      # Publishing is main-only: changeset status resolves against the main
      # base ref and the npm trusted publisher is registered for this workflow
      # running on main. Dispatching on any other ref used to die mid-run with
      # changesets' "Failed to find where HEAD diverged from main" (GAP-380,
      # runs 29518547299 + 29559527527, both dispatched on test). Fail fast
      # with an actionable message instead.
      - name: Guard dispatch ref (main only)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release.yml publishes from main only; it was dispatched on ${{ github.ref }}."
          echo "::error::Re-run with: gh workflow run release.yml --ref main"
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Need remote package@version tags so `changeset tag` can skip names
          # that already exist (idempotent re-run) and so the tag step can
          # verify coverage when tags point at the version-bump commit rather
          # than the current main HEAD (common after a promote merge).
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Annotated tags from `changeset publish` / `changeset tag` need an
      # identity. Set once for the whole job (publish + explicit tag step).
      - name: Configure git identity for annotated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # NOTE: Do NOT add registry-url here. It exports a placeholder
          # NODE_AUTH_TOKEN that blocks OIDC trusted publishing.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check pending changesets
        # Uses package.json "changeset" script (yaml safeLoad polyfill for js-yaml@5).
        # After a version PR, .changeset/*.md are consumed — status may exit 1 with
        # "no changesets were found". That is OK; publish uses package.json vs npm.
        run: |
          set +e
          pnpm changeset status --verbose
          code=$?
          set -e
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$code" -ne 0 ] && [ "${pending:-0}" = "0" ]; then
            echo "No pending changeset files — OK after version bump; proceeding to publish unpublished package versions."
            exit 0
          fi
          exit "$code"

      - name: Build all packages
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm@4.2.1 --output-file sbom.json --output-format json
        continue-on-error: true

      - name: Upload SBOM artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Validate release artifacts
        run: pnpm validate:artifacts

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "[dry-run] Would run: pnpm changeset publish --provenance"
          pnpm changeset status

      - name: Publish to npm with provenance
        if: ${{ !inputs.dry-run }}
        run: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # `changeset tag` creates ANNOTATED tags (`git tag -m`). Annotated tags
      # require a committer identity (set above). Callers log "New tag:" before
      # the call and ignore false returns, so identity must be set first
      # (runs 31158518015, …).
      #
      # Re-run / post-promote case: package@version tags often point at the
      # version-bump commit, not the current main HEAD (promote merge). Then
      # `changeset tag` creates nothing (names already exist) and
      # `git tag --points-at HEAD` is empty — that is OK if every non-private
      # packages/* version already has a tag by name (run 31173877847).
      - name: Create + push tags
        if: ${{ !inputs.dry-run }}
        run: |
          # Identity already set in "Configure git identity for annotated tags".
          pnpm changeset tag
          mapfile -t head_tags < <(git tag --points-at HEAD)
          tag_count="${#head_tags[@]}"
          if [ "$tag_count" -gt 0 ]; then
            echo "Pushing $tag_count tag(s) at HEAD:"
            printf '  %s\n' "${head_tags[@]}"
            git push origin --tags
            exit 0
          fi

          echo "No tags at HEAD after changeset tag — checking package@version tags by name (idempotent re-run / promote lag)."
          echo "HEAD=$(git rev-parse HEAD)"
          echo "git user.email=$(git config --get user.email || echo unset)"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");
          const tags = new Set(
            execFileSync("git", ["tag"], { encoding: "utf8" })
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => line.length > 0),
          );
          const packagesRoot = path.join(process.cwd(), "packages");
          const missing = [];
          let checked = 0;
          for (const entry of fs.readdirSync(packagesRoot, { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const manifestPath = path.join(packagesRoot, entry.name, "package.json");
            if (!fs.existsSync(manifestPath)) continue;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.private === true) continue;
            if (typeof manifest.name !== "string" || typeof manifest.version !== "string") continue;
            checked += 1;
            const tag = `${manifest.name}@${manifest.version}`;
            if (!tags.has(tag)) missing.push(tag);
          }
          if (checked === 0) {
            console.error("::error::No non-private packages/* manifests found to verify tags.");
            process.exit(1);
          }
          if (missing.length > 0) {
            console.error(
              `::error title=Missing package tags::${missing.length} of ${checked} package@version tags missing after changeset tag:`,
            );
            for (const tag of missing) console.error(`  ${tag}`);
            console.error(
              "If identity is set and tags are still missing, git tag -m failed or tags were never recovered.",
            );
            process.exit(1);
          }
          console.log(
            `OK: all ${checked} non-private package versions already tagged by name (nothing new at HEAD).`,
          );
          NODE

      # Release bodies come from each package's own CHANGELOG.md section for the
      # tagged version (changesets convention). generate_release_notes is
      # deliberately NOT used: GitHub builds those notes from every commit since
      # the previous tag of the same package, which exceeds the 125,000-char
      # release-body limit for monorepo package tags (422 "body is too long").
      # The script fails this step if any release creation fails — the previous
      # per-tag catch-and-warn reported success while every creation 422'd.
      - name: Create GitHub releases
        if: ${{ !inputs.dry-run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/create-github-releases.cjs')
            await run({ github, context, core })
