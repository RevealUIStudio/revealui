name: Release OSS Packages

# Publishes OSS packages to npm with OIDC trusted publishing (no long-lived NPM_TOKEN).
# Provenance attestations (SLSA Build Level 2) are generated via --provenance.
#
# Prerequisites (one-time setup):
#   1. Configure trusted publishing on npmjs.org for each OSS package:
#      Package Settings > Publishing > Trusted Publishers > Add GitHub Actions
#      Repository: RevealUIStudio/revealui, Workflow: release.yml
#   2. No NPM_TOKEN secret is needed — OIDC handles authentication.
#
# Trigger: manually from GitHub Actions UI (Actions > Release OSS Packages > Run workflow)
# Changesets must already be applied (pnpm changeset version committed to main).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — build and preview without publishing"
        type: boolean
        default: false

permissions:
  contents: write # push tags, create GitHub releases
  id-token: write # OIDC token for npm provenance (SLSA B2)

concurrency:
  group: release-oss
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  # CI runners must not execute dev-machine git hooks: the husky pre-push gate
  # fired on the "Push tags" step (run 27389106334) and ran the full repo gate
  # inside the release runner — an environment the admin test suite was never
  # provisioned for — blocking the tag push AFTER packages had already
  # published. Husky honors HUSKY=0 by skipping hook install + execution.
  HUSKY: "0"

jobs:
  release:
    name: Publish OSS to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish

    steps:
      # Publishing is main-only: changeset status resolves against the main
      # base ref and the npm trusted publisher is registered for this workflow
      # running on main. Dispatching on any other ref used to die mid-run with
      # changesets' "Failed to find where HEAD diverged from main" (GAP-380,
      # runs 29518547299 + 29559527527, both dispatched on test). Fail fast
      # with an actionable message instead.
      - name: Guard dispatch ref (main only)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release.yml publishes from main only; it was dispatched on ${{ github.ref }}."
          echo "::error::Re-run with: gh workflow run release.yml --ref main"
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Annotated tags from `changeset publish` / `changeset tag` need an
      # identity. Set once for the whole job (publish + explicit tag step).
      - name: Configure git identity for annotated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          # NOTE: Do NOT add registry-url here. It exports a placeholder
          # NODE_AUTH_TOKEN that blocks OIDC trusted publishing.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check pending changesets
        run: pnpm changeset status --verbose

      - name: Build all packages
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm@4.2.1 --output-file sbom.json --output-format json
        continue-on-error: true

      - name: Upload SBOM artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Validate release artifacts
        run: pnpm validate:artifacts

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "[dry-run] Would run: pnpm changeset publish --provenance"
          pnpm changeset status

      - name: Publish to npm with provenance
        if: ${{ !inputs.dry-run }}
        run: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # `changeset tag` creates ANNOTATED tags (`git tag -m`). Annotated tags
      # require a committer identity. Actions runners do not set user.name /
      # user.email by default, so `git tag -m` fails with empty ident.
      # @changesets/git.tag() returns false on failure but callers only log
      # "New tag:" *before* the call and ignore the return value — so the step
      # used to print "New tag:" for every package then find zero tags at HEAD
      # (runs 31158518015, 31141045252, …). Fix: set bot identity before tag,
      # then fail loud with diagnostics if HEAD still has no tags.
      # `git push --tags` pushes both annotated and lightweight tags.
      - name: Create + push tags
        if: ${{ !inputs.dry-run }}
        run: |
          # Identity already set in "Configure git identity for annotated tags".
          pnpm changeset tag
          mapfile -t head_tags < <(git tag --points-at HEAD)
          tag_count="${#head_tags[@]}"
          if [ "$tag_count" -eq 0 ]; then
            echo "::error title=No tags at HEAD::changeset tag left zero tags at HEAD. Annotated tags need git user.name/email (set above). Check for pre-existing tag name collisions or git tag failures."
            echo "git user.email=$(git config --get user.email || echo unset)"
            echo "git user.name=$(git config --get user.name || echo unset)"
            echo "HEAD=$(git rev-parse HEAD)"
            git tag -l | tail -20 || true
            exit 1
          fi
          echo "Pushing $tag_count tag(s) at HEAD:"
          printf '  %s\n' "${head_tags[@]}"
          git push origin --tags

      # Release bodies come from each package's own CHANGELOG.md section for the
      # tagged version (changesets convention). generate_release_notes is
      # deliberately NOT used: GitHub builds those notes from every commit since
      # the previous tag of the same package, which exceeds the 125,000-char
      # release-body limit for monorepo package tags (422 "body is too long").
      # The script fails this step if any release creation fails — the previous
      # per-tag catch-and-warn reported success while every creation 422'd.
      - name: Create GitHub releases
        if: ${{ !inputs.dry-run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/create-github-releases.cjs')
            await run({ github, context, core })
