name: Webhook Reconciliation Check

# Weekly check for unreconciled webhook events — payments that were captured
# but never fulfilled due to processing failures with stuck idempotency markers.
#
# Schedule: Every Monday at 08:00 UTC (03:00 ET)
# Manual: workflow_dispatch for on-demand checks

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"

jobs:
  check:
    name: Check Unreconciled Webhooks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Query unreconciled webhooks
        id: query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Capture JSON on stdout to a file (the script logs errors to stderr).
          # Only the scalar exit_code/count cross steps via GITHUB_OUTPUT — never
          # the multi-line JSON, which `echo "output=$JSON" >> "$GITHUB_OUTPUT"`
          # would truncate at the first newline and corrupt the output map.
          set +e
          pnpm tsx scripts/commands/database/check-unreconciled.ts >/tmp/unrecon.json 2>/tmp/unrecon.err
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            COUNT=$(jq -r '.count' /tmp/unrecon.json)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $COUNT unreconciled webhook event(s)"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No unreconciled webhooks found"
          else
            echo "::error::Check script failed with exit code $EXIT_CODE"
            cat /tmp/unrecon.err 2>/dev/null || true
            exit 1
          fi

      - name: Create or update issue
        if: steps.query.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.query.outputs.count }}
        run: |
          # Build the body from the captured JSON file into a file, then post via
          # --body-file. Nothing attacker-influenced or multi-line is interpolated
          # into the shell: COUNT is a numeric step output passed through env, and
          # the rows come from the file, not a re-interpolated ${{ }} expression.
          ROWS=$(jq '.rows' /tmp/unrecon.json)
          {
            echo "## Unreconciled Webhook Events"
            echo ""
            echo "**${COUNT}** webhook event(s) failed processing and could not clean up their idempotency markers. These represent payments that may not have been fulfilled."
            echo ""
            echo "### Action Required"
            echo "For each event below:"
            echo "1. Look up the event in the [Stripe Dashboard](https://dashboard.stripe.com/events)"
            echo "2. Verify whether the customer received their license"
            echo "3. If not: manually provision the license or issue a refund"
            echo "4. Mark resolved in the database: \`UPDATE unreconciled_webhooks SET resolved_at = NOW(), resolved_by = 'manual' WHERE event_id = '<id>'\`"
            echo ""
            echo "### Events"
            echo '```json'
            echo "$ROWS"
            echo '```'
            echo ""
            echo "---"
            echo "_Generated by webhook-reconciliation.yml on $(date -u +%Y-%m-%dT%H:%M:%SZ)_"
          } > /tmp/issue-body.md

          EXISTING=$(gh issue list --label "webhook-reconciliation" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "Action Required: ${COUNT} unreconciled webhook event(s)" \
              --body-file /tmp/issue-body.md \
              --label "webhook-reconciliation,billing,priority:high"
            echo "Created new reconciliation issue"
          fi
