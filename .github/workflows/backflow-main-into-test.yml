name: backflow-main-into-test

# Thin caller — delegates to the org-shared reusable backflow workflow:
#   RevealUIStudio/.github/.github/workflows/backflow-reusable.yml
# Requires the BACKFLOW_APP_ID / BACKFLOW_APP_PRIVATE_KEY secrets + the
# revfleet-backflow App installed on this repo (Contents + Pull requests r/w).
# Triggers on push to BOTH main and test, and on PRs targeting test:
#   - push:main — main moved forward; open a backflow PR so test catches up.
#   - push:test — self-heal: if ancestry is still broken (legacy squash of a
#     backflow PR), re-run lands main into test via merges API (two-parent).
#     Primary path no longer opens a human-squashable PR. No-ops when test
#     already contains main.
#   - pull_request:test — job `backflow-current` fails other PRs while
#     origin/test does not contain origin/main (required check name:
#     `backflow / backflow-current`). The backflow PR itself is allowed.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [test]

# Serialize land (push) separately from the PR gate so a feature PR check
# cannot queue behind or delay auto-backflow.
concurrency:
  group: backflow-main-into-test-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  backflow:
    # Pinned to a SHA — org-shared reusable was referenced by the mutable @main.
    # Bump this deliberately when the reusable changes.
    uses: RevealUIStudio/.github/.github/workflows/backflow-reusable.yml@2945c01d70bfc0aabb129203ceee9071649f6ca8 # org .github#15 merge — backflow-current gate on PRs to test
    # Scope to ONLY the two secrets the reusable declares (its workflow_call.secrets
    # block documents this exact form) instead of `secrets: inherit`, which would
    # forward every caller secret (VERCEL_TOKEN, PROD_POSTGRES_URL, …) into it.
    secrets:
      BACKFLOW_APP_ID: ${{ secrets.BACKFLOW_APP_ID }}
      BACKFLOW_APP_PRIVATE_KEY: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}
