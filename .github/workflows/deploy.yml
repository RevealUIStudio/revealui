name: Deploy

# Production-only deployment. Vercel Git Integration is DISABLED.
#
# Trigger: push to main (merge from test), or workflow_dispatch when the ref
# is refs/heads/main. Any other ref fails in Production ref guard before
# validate, migrate, or deploy.
# Only affected apps are deployed — if a shared package changes, all apps deploy.
#
# Pre-deploy validation: migration drift check only (no full typecheck —
# CI already validated before merge via branch protection).
#
# Branch pipeline:
#   feature/* → PR → test (CI only, no deploy)
#   test → PR → main (full CI required, deploy on merge)
#   Manual test preview: deploy-test.yml (workflow_dispatch)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to deploy (comma-separated, or 'all' to force all)"
        required: false
        type: string
        default: auto

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  # Production tokens are not workflow env. Environment secrets are visible
  # only to jobs that name the production environment. The ref guard, detect,
  # design verify, and summary jobs do not receive them.
  TURBO_TEAM: ${{ vars.TURBO_TEAM || 'revealuistudio' }}

jobs:
  # Fail closed before any production job. workflow_dispatch can select any
  # branch; push is already limited to main. Skipped jobs would still leave
  # the workflow green, so this job exits 1 with a clear message.
  production-ref:
    name: Production ref guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploy jobs run only when the ref is refs/heads/main. This run is ${GITHUB_REF}. Refusing before validate, migrate, or deploy."
            exit 1
          fi
          echo "Production ref ok: ${GITHUB_REF}"

  # ---------------------------------------------------------------------------
  # Pre-deploy validation — migration drift only (typecheck runs in CI)
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Migrations
    needs: [production-ref, detect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Preflight design verifier access before migrations
        if: needs.detect.outputs.has-apps == 'true' && (contains(needs.detect.outputs.app-list, 'marketing') || contains(needs.detect.outputs.app-list, 'docs'))
        # Runner access only, against the stable deployment hosts. This step
        # runs before the new deployment exists. Token and font checks run
        # after deploy. Existing CSS damage must not block a corrective deploy.
        env:
          APP_LIST: ${{ needs.detect.outputs.app-list }}
        run: |
          ARGS=""
          case " $APP_LIST " in
            *" marketing "*) ARGS="$ARGS --url https://revealui-marketing-revealui-studio.vercel.app" ;;
          esac
          case " $APP_LIST " in
            *" docs "*) ARGS="$ARGS --url https://revealui-docs-revealui-studio.vercel.app" ;;
          esac
          node packages/tokens/scripts/verify-deployed-tokens.cjs --reachability-only $ARGS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for uncommitted migrations
        run: |
          echo "Building DB package (with dependencies) for drizzle-kit schema check..."
          pnpm turbo build --filter=@revealui/db
          DRIZZLE_REQUIRE_URL=false npx drizzle-kit generate --config=packages/db/drizzle.config.ts 2>&1 || true
          DRIFT=$(git diff --name-only -- packages/db/migrations/)
          NEW=$(git ls-files --others --exclude-standard -- packages/db/migrations/)
          if [ -n "$DRIFT" ] || [ -n "$NEW" ]; then
            echo "::error::Schema drift detected — migrations need to be generated and committed"
            echo "Changed: $DRIFT"
            echo "New: $NEW"
            git checkout -- packages/db/migrations/ 2>/dev/null || true
            exit 1
          fi
          echo "No migration drift detected."

      # ── Pre-deploy production env validation (api project) ─────────────
      # Mirrors apps/server/src/lib/validate-startup.ts → validateStartup so
      # presence + format errors fail the gate before deploy starts. The
      # 2026-04-25 #540 incident root-cause was env config that the prior
      # in-deploy bash grep missed: vars unset by name plus malformed
      # values (sk_test_ in live mode, REVEALUI_CRON_SECRET <32 chars,
      # missing REVEALUI_LICENSE_PRIVATE_KEY) — all of which throw in
      # validateStartup at module init but were invisible to a name-only
      # `vercel env ls | grep` check. Closes GAP-125.

      # Pinned, not @latest (all 3 install sites in this file): the unpinned
      # CLI auto-bumped 56.2.1 -> 56.3.1 mid-train on 2026-07-17 and changed
      # what `vercel pull` emits for sensitive-type vars (decrypted values ->
      # the [SENSITIVE] placeholder), failing prod-env validation with 10
      # findings while neither the repo nor the project env had changed.
      # Bump deliberately, in lockstep with scripts/validate/prod-env.ts.
      - name: Install Vercel CLI
        run: pnpm add -g vercel@56.3.1

      - name: Vercel project settings lockstep (live)
        run: pnpm validate:vercel-settings -- --live
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Resolve api project id from .github/vercel-projects.json
        run: echo "API_PROJECT_ID=$(jq -r '.api' .github/vercel-projects.json)" >> "$GITHUB_ENV"

      - name: Pull production env from Vercel (api project)
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          if [ ! -f .vercel/.env.production.local ]; then
            echo "::error::vercel pull produced no .env.production.local"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.API_PROJECT_ID }} # api (from .github/vercel-projects.json)

      - name: Build validate-startup deps (@revealui/core + @revealui/services)
        # validate-startup.ts has top-level imports the tsx invocation in
        # validate:prod-env must resolve to built dist:
        #   - @revealui/core/license (validateLicenseKey, Forge-mode branch)
        #   - @revealui/services/stripe/mode (shared Stripe live/test classifier,
        #     also used by the runtime getStripe() guard)
        # @revealui/db is built in the earlier step. Hosted-mode validation does
        # not call into license/Stripe code, but the module-level imports still
        # need to resolve, so their dist must exist.
        run: pnpm turbo build --filter=@revealui/core --filter=@revealui/services

      - name: Validate prod env (presence + format, mirrors validateStartup)
        run: pnpm validate:prod-env

  # ---------------------------------------------------------------------------
  # Apply pending database migrations (additive-only by convention)
  # Runs after validation, before deploy — new schema must exist before new code.
  # ---------------------------------------------------------------------------
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest
    needs: [production-ref, validate]
    timeout-minutes: 5
    environment: production
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DB package
        run: pnpm turbo build --filter=@revealui/db

      - name: Run migrations
        # Runs drizzle-kit migrate (non-interactive, applies pending SQL
        # files from packages/db/migrations/ against the __drizzle_migrations
        # meta table). Do NOT invoke root `pnpm db:migrate` here — that
        # forwards to drizzle-kit migrate via the @revealui/db filter too,
        # but keeping the explicit --filter form makes the CI contract obvious.
        #
        # Output capture: drizzle-kit's TUI spinner uses `\r` to overwrite
        # the previous line, which causes the actual error message to be
        # eaten when the migrator fails (see 2026-04-19 incident — the
        # `duplicate_object` from 0005's unguarded ADD CONSTRAINT was
        # invisible until the spinner output was inspected manually).
        # Forcing NO_COLOR + piping through `tr '\r' '\n'` converts each
        # spinner tick to its own line, leaving the trailing error visible.
        # PIPESTATUS preserves drizzle-kit's exit code through the pipe.
        #
        # GAP-168 defense-in-depth (sandwich the migrate with two guards):
        #   1. db:backfill-migrations BEFORE — detects the 2026-04-20 incident
        #      class (drizzle.__drizzle_migrations rows missing for journal
        #      entries) and fails the deploy with a clear diagnostic before
        #      drizzle-kit re-applies already-applied SQL.
        #   2. db:assert-migration-count AFTER — asserts the post-migrate
        #      tracking row count matches the journal entry count, catching
        #      half-applied state regardless of which side drifted.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
          # PROD_POSTGRES_URL mirrors Vercel revealui-api POSTGRES_URL (Sensitive),
          # because `vercel env pull` returns empty strings for Sensitive vars and
          # this step needs the actual value to run drizzle-kit migrate. Long-term:
          # revvault-vercel-sync Phase 5 replaces this mirror with revvault as
          # the canonical source for both Vercel + this secret.
          POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL }}
        run: |
          if [ -z "${POSTGRES_URL:-}" ]; then
            echo "::error::PROD_POSTGRES_URL is not set for this job"
            exit 1
          fi
          echo "::group::Backfill check (pre-migrate)"
          pnpm db:backfill-migrations
          echo "::endgroup::"
          echo "::group::drizzle-kit migrate"
          pnpm --filter @revealui/db db:migrate 2>&1 | tr '\r' '\n'
          MIGRATE_STATUS=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$MIGRATE_STATUS" -ne 0 ]; then
            echo "::error::drizzle-kit migrate exited $MIGRATE_STATUS"
            exit "$MIGRATE_STATUS"
          fi
          echo "::group::Migration count assertion (post-migrate)"
          pnpm db:assert-migration-count
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Detect which apps were affected by the merge
  # ---------------------------------------------------------------------------
  detect:
    name: Detect Affected Apps
    runs-on: ubuntu-latest
    needs: [production-ref]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-apps: ${{ steps.detect.outputs.has-apps }}
      sha: ${{ steps.detect.outputs.sha }}
      app-list: ${{ steps.detect.outputs.app-list }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect affected apps
        id: detect
        env:
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          ALL_APPS="api admin marketing docs"

          # Manual override: deploy specific apps or all
          if [ -n "$INPUT_APPS" ] && [ "$INPUT_APPS" != "auto" ]; then
            if [ "$INPUT_APPS" = "all" ]; then
              AFFECTED="$ALL_APPS"
            else
              AFFECTED=$(echo "$INPUT_APPS" | tr ',' ' ')
            fi
            echo "::notice::Manual deploy: $AFFECTED"
          else
            # Auto-detect from git diff
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")

            if [ -z "$CHANGED" ]; then
              echo "::notice::No changes detected — deploying all apps"
              AFFECTED="$ALL_APPS"
            else
              AFFECTED=""

              # Check each app directory for direct changes.
              # The "api" deploy target lives in apps/server/, not apps/api/,
              # so map the logical app name to its source directory before the
              # path check — otherwise server-only merges never match and the
              # API deploy is silently skipped.
              for app in $ALL_APPS; do
                case "$app" in
                  api) app_dir="server" ;;
                  *) app_dir="$app" ;;
                esac
                if echo "$CHANGED" | grep -q "^apps/$app_dir/"; then
                  AFFECTED="$AFFECTED $app"
                fi
              done

              # Shared packages changed → deploy all apps
              if echo "$CHANGED" | grep -q "^packages/"; then
                echo "::notice::Shared package changed — deploying all apps"
                AFFECTED="$ALL_APPS"
              fi

              # Root config changed → deploy all apps
              if echo "$CHANGED" | grep -qE "^(package\.json|pnpm-lock\.yaml|turbo\.json|\.env)"; then
                echo "::notice::Root config changed — deploying all apps"
                AFFECTED="$ALL_APPS"
              fi

              # Deduplicate
              AFFECTED=$(echo "$AFFECTED" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
            fi
          fi

          if [ -z "$AFFECTED" ]; then
            echo "::notice::No apps affected — skipping deploy"
            echo "has-apps=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "app-list=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has-apps=true" >> "$GITHUB_OUTPUT"
          echo "app-list=$AFFECTED" >> "$GITHUB_OUTPUT"

          # Build matrix JSON from the single-source project-id map
          # (.github/vercel-projects.json). Unknown apps are dropped from the
          # matrix (and warned below), matching the prior case-statement.
          MATRIX=$(jq -cn --slurpfile map .github/vercel-projects.json --arg apps "$AFFECTED" '
            [ ($apps | split(" ") | .[] | select(length > 0))
              | select($map[0][.] != null)
              | {app: ., "project-id": $map[0][.]} ]
          ')
          for app in $AFFECTED; do
            if [ "$(jq -r --arg a "$app" '.[$a] // "null"' .github/vercel-projects.json)" = "null" ]; then
              echo "::warning::Unknown app: $app"
            fi
          done

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying: $AFFECTED"

  # ---------------------------------------------------------------------------
  # Deploy affected apps in parallel
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    # api's Vercel build runs ~19 min on EVERY deploy: the turbo monorepo build
    # is a remote-cache FULL TURBO hit (~4s), but Vercel's own @vercel/node
    # compile of the Hono server (apps/server) takes ~19 min and is NOT turbo-
    # cached — so this is not a cold-turbo-cache problem. At timeout-minutes: 20
    # that build starved the `vercel deploy` step and GitHub cancelled the job
    # mid-deploy at the 20-min wall (run 27769702651, 2026-06-18: Build 19m0s →
    # Deploy cancelled 49s in). The deploy only "succeeded" because Vercel
    # finishes the build server-side and aliases the domain independently of the
    # GH job. 40 gives build (~19m) + deploy (~1-2m) + headroom so the job itself
    # completes. (admin/marketing/docs build in 1-3.5 min; the wall is api-
    # specific, but the limit is shared across the matrix.)
    timeout-minutes: 40
    needs: [production-ref, validate, migrate, detect]
    if: needs.detect.outputs.has-apps == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || secrets.VERCEL_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@56.3.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ matrix.project-id }}

      # Critical env validation runs upstream in the `validate` job for the
      # api project (mirrors validateStartup format + presence checks). The
      # previous in-deploy bash grep against `vercel env ls` output covered
      # name-presence only and missed every value-format rule — replaced
      # here as part of GAP-125. Admin's public deployment posture is checked
      # against this app's pulled environment before build/deploy; remaining
      # admin environment requirements are enforced by instrumentation at boot.

      - name: Validate admin production posture
        if: matrix.app == 'admin'
        run: pnpm validate:prod-env --app admin

      - name: Override Vercel project settings for CI
        run: |
          if [ -f .vercel/project.json ]; then
            # Deploy target "api" is package "server". Its vercel-build script also
            # builds optional Pro packages (@revealui/ai, @revealui/services) when
            # present — plain `turbo --filter=server` does not (optional peers are
            # outside the graph). Other matrix apps match their package names.
            APP="${{ matrix.app }}"
            if [ "$APP" = "api" ]; then
              BUILD_CMD='pnpm run vercel-build'
            else
              BUILD_CMD="pnpm turbo build --filter=${APP}"
            fi
            jq --arg cmd "$BUILD_CMD" \
              '.settings.installCommand = "" | .settings.buildCommand = $cmd' \
              .vercel/project.json > .vercel/project.json.tmp
            mv .vercel/project.json.tmp .vercel/project.json
          fi

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ matrix.project-id }}
          SKIP_ENV_VALIDATION: "true"
          # GAP-403: monorepo TS wall removed via apps/server/vercel.json
          # excludeFiles (brace string). Preview api build 29783369901 completed
          # in ~1m with 0 "Using TypeScript" / 0 sibling-app TS diagnostics.
          # The #2010 NODE_OPTIONS=6144 ceiling is no longer required.

      - name: Deploy
        id: deploy
        # --archive=tgz: single tarball upload avoids Vercel free-tier
        # api-upload-free (5000 file) rate limit on monorepo prebuilts.
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/deploy-url"
          printf '%s\n' "$URL" > "$RUNNER_TEMP/deploy-url/url.txt"
          echo "::notice::${{ matrix.app }} deployed to $URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ matrix.project-id }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-url-${{ matrix.app }}
          path: ${{ runner.temp }}/deploy-url/url.txt
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Post-deploy smoke test
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    # API and admin each wait for a production alias before probing.
    # Each wait is 12 attempts of curl --max-time 10 plus 10s sleep (about
    # 4 minutes). The previous 10 minute job budget covered the admin wait.
    # 15 minutes covers both waits and still lets the failure rollback step start.
    timeout-minutes: 15
    needs: [production-ref, detect, deploy]
    environment: production

    steps:
      # Checkout required for durable REST rollback script on failure
      # (scripts/deploy/vercel-rollback-previous-prod.mjs). Shallow is enough.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          fetch-depth: 1

      # Node for the rollback script (no pnpm/vercel CLI parse path).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # API and admin probes use the production domain after that domain's
      # alias is assigned to the deployment that just shipped. Raw generated
      # URLs are not probed.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: deploy-url-*
          path: deploy-urls

      - name: Health check — API (readiness probe)
        env:
          API_ALIAS: api.revealui.com
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          URL_FILE="deploy-urls/deploy-url-api/url.txt"
          if [ ! -f "$URL_FILE" ]; then
            echo "::notice::api was not in this deploy, skipping readiness probe"
            exit 0
          fi
          # The API custom domain is outside deployment protection (protection
          # covers generated deployment URLs). Wait until the production alias
          # points at this deployment, then probe https://api.revealui.com.
          # Same budget as the admin alias wait: curl --max-time 10, 12 tries.
          # No bypass secret or header is used.
          API_URL=$(tr -d '[:space:]' < "$URL_FILE")
          API_HOST="${API_URL#https://}"
          API_HOST="${API_HOST%%/*}"
          API_PROJECT_ID=$(jq -r '.api' .github/vercel-projects.json)
          VERCEL_API="https://api.vercel.com"
          DPL_ID=$(curl -sf --max-time 10 -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API}/v6/deployments?projectId=${API_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&state=READY&limit=20" \
            | jq -r --arg host "$API_HOST" '[.deployments[]? | select(.url == $host) | .uid][0] // empty' || true)
          if [ -z "$DPL_ID" ]; then
            echo "::error::No READY production deployment found for $API_URL"
            exit 1
          fi
          echo "Waiting for ${API_ALIAS} on ${DPL_ID}..."
          ALIASED=false
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${VERCEL_API}/v2/deployments/${DPL_ID}/aliases?teamId=${VERCEL_ORG_ID}" \
              | jq -e --arg alias "$API_ALIAS" 'any(.aliases[]?; .alias == $alias)' > /dev/null; then
              ALIASED=true
              break
            fi
            echo "Alias attempt $i/12: not on this deployment yet, waiting 10s..."
            sleep 10
          done
          if [ "$ALIASED" != "true" ]; then
            echo "::error::${API_ALIAS} was not assigned to ${DPL_ID} within 2 minutes"
            exit 1
          fi
          PUBLIC_URL="https://${API_ALIAS}/health/ready"
          echo "Checking $PUBLIC_URL (production domain)..."
          CODE=""
          for i in $(seq 1 12); do
            BODY_FILE="${RUNNER_TEMP}/api-ready-${i}.json"
            CODE=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' --max-time 10 --max-redirs 0 \
              "${PUBLIC_URL}?smoke=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$CODE" = "200" ] && jq -e '(.status | type) == "string" and .status != ""' "$BODY_FILE" > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            echo "Attempt $i/12, waiting 10s..."
            sleep 10
          done
          echo "::error::API readiness check failed after 2 minutes ($PUBLIC_URL, last HTTP ${CODE:-none})"
          exit 1

      - name: Health check — Admin
        env:
          ADMIN_ALIAS: admin.revealui.com
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          URL_FILE="deploy-urls/deploy-url-admin/url.txt"
          if [ ! -f "$URL_FILE" ]; then
            echo "::notice::admin was not in this deploy — skipping admin probe"
            exit 0
          fi
          # The admin custom domain is outside Vercel deployment protection
          # (protection covers all deployments except custom domains). Raw
          # *.vercel.app URLs answer with a 302 to Vercel SSO, which curl -sf
          # counts as success, so they cannot prove admin health. Wait until
          # the production alias points at this deployment, then probe the
          # custom domain and require HTTP 200. No bypass secret is used.
          ADMIN_URL=$(tr -d '[:space:]' < "$URL_FILE")
          ADMIN_HOST="${ADMIN_URL#https://}"
          ADMIN_HOST="${ADMIN_HOST%%/*}"
          ADMIN_PROJECT_ID=$(jq -r '.admin' .github/vercel-projects.json)
          VERCEL_API="https://api.vercel.com"
          # Cap each Vercel API call at 10s so a hung request fails this step
          # and the failure rollback can still run inside the job timeout.
          DPL_ID=$(curl -sf --max-time 10 -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API}/v6/deployments?projectId=${ADMIN_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&state=READY&limit=20" \
            | jq -r --arg host "$ADMIN_HOST" '[.deployments[]? | select(.url == $host) | .uid][0] // empty' || true)
          if [ -z "$DPL_ID" ]; then
            echo "::error::No READY production deployment found for $ADMIN_URL"
            exit 1
          fi
          echo "Waiting for ${ADMIN_ALIAS} on ${DPL_ID}..."
          ALIASED=false
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${VERCEL_API}/v2/deployments/${DPL_ID}/aliases?teamId=${VERCEL_ORG_ID}" \
              | jq -e --arg alias "$ADMIN_ALIAS" 'any(.aliases[]?; .alias == $alias)' > /dev/null; then
              ALIASED=true
              break
            fi
            echo "Alias attempt $i/12: not on this deployment yet, waiting 10s..."
            sleep 10
          done
          if [ "$ALIASED" != "true" ]; then
            echo "::error::${ADMIN_ALIAS} was not assigned to ${DPL_ID} within 2 minutes"
            exit 1
          fi
          PUBLIC_URL="https://${ADMIN_ALIAS}/login"
          echo "Checking $PUBLIC_URL (custom domain, outside deployment protection)..."
          CODE=""
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}?smoke=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$CODE" = "200" ]; then
              echo "Admin healthy"
              exit 0
            fi
            echo "Attempt $i/12 — waiting 10s..."
            sleep 10
          done
          echo "::error::Admin health check failed after 2 minutes ($PUBLIC_URL, last HTTP ${CODE:-none})"
          exit 1

      - name: Invocation guard — API (real function invocation)
        # GET /api/billing/subscription with no session returns the app's own
        # 401 JSON (success false, error "Authentication required", code
        # HTTP_401). Readiness can pass while a real route still fails, so
        # this probe must see that JSON. HTML, a redirect to vercel.com, a
        # protection header, a 5xx, or a timeout does not pass. The readiness
        # step already confirmed api.revealui.com points at this deployment.
        # This step probes that domain only. Cache-bust with the run id.
        # Failure still trips the existing `if: failure()` rollback below.
        run: |
          URL_FILE="deploy-urls/deploy-url-api/url.txt"
          if [ ! -f "$URL_FILE" ]; then
            echo "::notice::api was not in this deploy, skipping invocation guard"
            exit 0
          fi
          PROBE="https://api.revealui.com/api/billing/subscription?_cb=${GITHUB_RUN_ID}"
          echo "Invocation guard: GET $PROBE"
          for i in $(seq 1 12); do
            if node scripts/deploy/api-invocation-guard.mjs --url "$PROBE"; then
              echo "Invocation OK"
              exit 0
            fi
            echo "Attempt $i/12 did not pass, waiting 10s..."
            sleep 10
          done
          echo "::error::API invocation guard failed after 2 minutes ($PROBE)"
          exit 1

      - name: Rollback on failure
        if: failure()
        # Durable rollback (2026-07-21 #2027 postmortem): do NOT parse
        # `vercel ls | grep | sed`. That path returned empty when
        # VERCEL_TEAM_SLUG was set from TURBO_TEAM (wrong team vs the
        # project-owning team id), left broken aliases live, and required
        # manual REST alias reassignment.
        #
        # Use scripts/deploy/vercel-rollback-previous-prod.mjs:
        # Vercel REST + VERCEL_ORG_ID (team id secret) + project id from
        # detect matrix. Reassigns allowlisted production hostnames on the
        # newest READY prod deploy to the restore target and verifies.
        # Nested or preview names are not moved.
        #
        # Api and admin read a per-project rollback floor from a repository
        # variable (API_ROLLBACK_FLOOR_DEPLOYMENT_ID,
        # ADMIN_ROLLBACK_FLOOR_DEPLOYMENT_ID). The shared script resolves
        # that deployment by id. It must belong to the app project, target
        # production, and be READY. Candidates are compared by createdAt.
        # The floor deployment itself stays eligible. Targets created before
        # the floor are refused. If the variable is unset, the floor cannot
        # be resolved, the floor fails those checks, or no eligible target
        # remains, aliases stay on the live build and this step fails. Other
        # apps still restore the previous READY production deployment.
        #
        # Needs checkout for the script; smoke job previously had none.
        run: |
          set +e
          echo "::warning::Smoke test failed — rolling back affected apps via Vercel REST"
          APP_LIST="${{ needs.detect.outputs.app-list }}"
          ROLLBACK_FAILED=0
          for app in $APP_LIST; do
            PID=$(printf '%s' "$DETECT_MATRIX" | jq -r --arg a "$app" '.[] | select(.app == $a) | .["project-id"]' 2>/dev/null) || PID=""
            if [ -z "$PID" ] || [ "$PID" = "null" ]; then continue; fi
            echo ""
            echo "=== Rolling back $app ($PID) ==="
            if ! node scripts/deploy/vercel-rollback-previous-prod.mjs \
              --project-id "$PID" \
              --app-label "$app"; then
              echo "::warning::REST rollback failed for $app"
              ROLLBACK_FAILED=$((ROLLBACK_FAILED+1))
            fi
          done
          echo ""
          echo "=== Rollback summary ==="
          echo "Failed: $ROLLBACK_FAILED"
          if [ "$ROLLBACK_FAILED" -gt 0 ]; then
            echo "::error::One or more apps could not be auto-rolled-back — broken deploy may still be live; investigate immediately"
            exit 1
          fi
          echo "::error::Smoke test failed — affected apps were auto-rolled-back successfully; investigate cause before re-deploying"
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Team id (team_…), NOT TURBO_TEAM slug — see script header.
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DETECT_MATRIX: ${{ needs.detect.outputs.matrix }}
          ADMIN_ROLLBACK_FLOOR_DEPLOYMENT_ID: ${{ vars.ADMIN_ROLLBACK_FLOOR_DEPLOYMENT_ID }}
          API_ROLLBACK_FLOOR_DEPLOYMENT_ID: ${{ vars.API_ROLLBACK_FLOOR_DEPLOYMENT_ID }}

  # ---------------------------------------------------------------------------
  # Post-deploy design-system verification (marketing + docs)
  # Runs after deploy, against both the public URL and the deployment URL from artifact
  # deploy-url-<app> (url.txt). --url <origin>=<public-host> keeps the
  # allowlist, token parity, font resolvability, and font asset checks on
  # the public host. CSP is whatever that deployment response returns.
  #
  # This is post-deploy alert semantics: the deploy already happened, so a
  # failure here means that deployment drifted from the design system
  # (token-correct CSS whose brand fonts never loaded, because the CSP
  # blocked the external font host and the self-hosted family names did not
  # match the token stacks). Failing the workflow surfaces it.
  # ---------------------------------------------------------------------------
  design-verify:
    name: Verify Design System
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [production-ref, detect, deploy]
    if: ${{ success() && needs.detect.outputs.has-apps == 'true' && (contains(needs.detect.outputs.app-list, 'marketing') || contains(needs.detect.outputs.app-list, 'docs')) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: deploy-url-*
          path: deploy-urls

      - name: Verify deployed tokens + font resolution
        # The verifier is dependency-free (Node 24 global fetch) and reads the
        # canonical tokens.css + allowlist straight from the checkout, so no
        # `pnpm install` is required. It checks the deployment URL from the
        # deploy job and applies the public host allowlist. It exits non-zero
        # on any parity or font-resolvability failure, which fails this job
        # (and the workflow).
        env:
          APP_LIST: ${{ needs.detect.outputs.app-list }}
        run: |
          set -euo pipefail
          args=()
          case " $APP_LIST " in
            *" marketing "*)
              url_file="deploy-urls/deploy-url-marketing/url.txt"
              if [ ! -f "$url_file" ]; then
                echo "::error::marketing deployment URL artifact is missing"
                exit 1
              fi
              marketing_url=$(tr -d '[:space:]' < "$url_file")
              args+=(--url "${marketing_url}=www.revealui.com")
              args+=(--url "https://www.revealui.com")
              ;;
          esac
          case " $APP_LIST " in
            *" docs "*)
              url_file="deploy-urls/deploy-url-docs/url.txt"
              if [ ! -f "$url_file" ]; then
                echo "::error::docs deployment URL artifact is missing"
                exit 1
              fi
              docs_url=$(tr -d '[:space:]' < "$url_file")
              args+=(--url "${docs_url}=docs.revealui.com")
              args+=(--url "https://docs.revealui.com")
              ;;
          esac
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::notice::No design-system surface (marketing/docs) in this deploy, skipping"
            exit 0
          fi
          echo "Verifying deployed design system: ${args[*]}"
          node packages/tokens/scripts/verify-deployed-tokens.cjs "${args[@]}"

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: [production-ref, detect, deploy]
    if: always()

    steps:
      - name: Output deployment summary
        env:
          DEPLOY_SHA: ${{ needs.detect.outputs.sha }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          DEPLOY_APPS: ${{ needs.detect.outputs.app-list }}
        run: |
          cat <<EOF
          {
            "environment": "production",
            "sha": "$DEPLOY_SHA",
            "status": "$DEPLOY_STATUS",
            "apps": "$DEPLOY_APPS",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
