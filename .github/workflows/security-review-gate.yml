# Security review gate — review-before-merge enforcement.
#
# Runs on EVERY pull request (passes immediately when no security-sensitive
# surface is touched), so the check is safe to mark as a REQUIRED status check
# on `test`/`main`. Re-evaluates when reviews land or labels change, so a fresh
# verdict flips the same head SHA from HOLD to clear without a new push.
#
# Verdict sources the gate accepts: an approving GitHub review, or one of the
# labels understood by scripts/validate/security-review-gate.cjs.

name: Security Review Gate

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: security-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  security-review-gate:
    name: Security review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Evaluate with the BASE branch's copy of the gate scripts: the
          # trusted (base) logic judges the untrusted (head) change, so a PR's
          # own edits to these files cannot influence its evaluation. Changed
          # files, labels, comments, and reviews all come from the API, so the
          # checkout exists only to supply this script code.
          ref: ${{ github.event.pull_request.base.sha }}
          # GAP-404: gate loads SECURITY_PATHS from security-paths.shared.json
          # at module load. Sparse list must include that JSON or the job
          # crashes ENOENT before it can classify the PR (revealui#2074).
          sparse-checkout: |
            scripts/validate/security-review-gate.cjs
            scripts/validate/guardrail2-verdict.cjs
            scripts/validate/security-paths.shared.json
          sparse-checkout-cone-mode: false

      - name: Evaluate review gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/validate/security-review-gate.cjs \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
