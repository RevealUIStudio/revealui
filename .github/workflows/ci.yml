        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build apps
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Apply migrations to the smoke database
        run: pnpm --filter @revealui/db db:migrate
        env:
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"

      # See the E2E Smoke job: production admin refuses to boot without the
      # audit env (GAP-338/417, no escape hatch by design). Provision it.
      - name: Generate ephemeral audit signing key (E2E only)
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/e2e-audit-key.pem
          {
            echo "REVEALUI_AUDIT_SIGNING_KEY<<E2E_KEY_EOF"
            cat /tmp/e2e-audit-key.pem
            echo "E2E_KEY_EOF"
          } >> "$GITHUB_ENV"

      # next start forces NODE_ENV=production, so SKIP_ENV_VALIDATION does not
      # skip the Forge license gate. CI has no stamped key; opt into Free (OSS).
      - name: Start Admin server
        run: pnpm --filter admin start &
        env:
          SKIP_ENV_VALIDATION: "true"
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"
          REVEALUI_SECRET: "e2e-smoke-secret-at-least-32-chars-long"
          REVEALUI_PUBLIC_SERVER_URL: "http://localhost:4000"
          REVEALUI_KEK: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          REVEALUI_ALLOW_UNLICENSED_SELF_HOST: "true"

      - name: Start marketing server
        run: pnpm --filter marketing start &
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Wait for servers
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:4000 > /dev/null 2>&1 && \
            curl -sf http://localhost:3000 > /dev/null 2>&1 && \
            echo "Both servers ready" && exit 0
            echo "Waiting for servers... ($i/40)"
            sleep 3
          done
          echo "::error::Admin or marketing failed to start within 120s"
          exit 1

      - name: Run accessibility tests (fail on critical violations)
        run: npx playwright test --project=chromium e2e/accessibility.e2e.ts
        env:
          CI: "true"
          SKIP_ENV_VALIDATION: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:4000"
          MARKETING_BASE_URL: "http://localhost:3000"

      - name: Upload accessibility results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: accessibility-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

