name: CI

# Two-tier CI gate:
#   test branch: quality + typecheck + unit tests + build + E2E (~25 min)
#   main branch: full gate + integration + E2E + coverage (~20 min)
#
# Pipeline: feature/* → PR → test → PR → main → deploy
#
# Optimizations:
#   - Turbo remote cache: build artifacts shared across jobs
#   - PR jobs use --affected: only build/typecheck changed packages
#   - Coverage stays main/promote-only; E2E also runs on PRs into test so
#     production admin boot (`next start` + Forge license gate) cannot land
#     untested.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || 'revealuistudio' }}
  PNPM_INSTALL_FLAGS: "--frozen-lockfile"

jobs:
  # ---------------------------------------------------------------------------
  # GAP-428: seed GHCR mirrors before any job that uses service containers.
  # Docker Hub anonymous pulls from runner IPs flake; GHCR + GITHUB_TOKEN does not.
  # ---------------------------------------------------------------------------
  ensure-ci-images:
    name: Ensure CI service images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror pgvector + postgres if missing or refresh
        env:
          GHCR_OWNER: revealuistudio
        run: |
          set -euo pipefail
          mirror() {
            local src="$1"
            local dest="$2"
            # If GHCR already has the tag, still re-pull upstream weekly via
            # mirror-ci-images.yml; here we ensure presence for this run.
            if docker pull "$dest" 2>/dev/null; then
              echo "GHCR hit: $dest"
              return 0
            fi
            echo "GHCR miss — seeding from Docker Hub: $src"
            docker pull "$src"
            docker tag "$src" "$dest"
            docker push "$dest"
          }
          mirror "pgvector/pgvector:pg16" "ghcr.io/${GHCR_OWNER}/pgvector:pg16"
          mirror "postgres:16" "ghcr.io/${GHCR_OWNER}/postgres:16"

  # ---------------------------------------------------------------------------
  # Phase 1: Quality checks (all branches)
  # ---------------------------------------------------------------------------
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build @revealui/harnesses (gates + manager modules, GAP-408/GAP-421)
        # Built once, early, for two dist-only consumers that must not reach
        # into src/ (GAP-421 §6.2): doc-currency.ts resolves its
        # SHARED_FLEET_RULES detection tuples from dist/gates, and
        # structure.ts resolves checkManager from dist/manager (manager-resolver.cjs,
        # mirroring gates-resolver.cjs). Absence degrades gracefully for
        # doc-currency (warn + shared-rules-skipped run) but fails closed for
        # the manager check (GAP-406 hard-fail posture), so this step must run
        # before Structure validation and the path-gated manager-only check
        # below.
        # `...` includes workspace deps (e.g. @revealui/security for policy
        # snapshot crypto / GAP-381 I-5) so DTS can resolve @revealui/security/server.
        # turbo ^build order applies.
        run: pnpm turbo run build --filter=@revealui/harnesses...
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Biome lint (hard fail)
        run: pnpm lint

      - name: Any-type audit
        run: pnpm audit:any

      - name: Console audit
        run: pnpm audit:console

      # Phase 6 prevention: exact clone report under packages/ (advisory only)
      - name: Exact clone audit (packages/, advisory)
        continue-on-error: true
        run: pnpm audit:clones

      - name: Structure validation
        run: pnpm validate:structure

      - name: Version policy validation
        run: pnpm validate:versions

      - name: React RSC CVE floor validation (hard fail)
        # react / react-dom / react-server-dom-webpack must each RESOLVE at
        # >=19.2.4 (final fix for the Dec-2025 React RSC CVE series:
        # CVE-2025-55182 "React2Shell" RCE, CVE-2025-55184/55183,
        # CVE-2025-67779) and in lockstep: version skew between react and
        # its server-dom binding is an RSC flight-protocol failure mode.
        # Reads resolved versions (pnpm virtual store), not declared ranges;
        # absent packages pass, so the guard engages automatically when
        # @revealui/router 0.4.0 adds react-server-dom-webpack. Mirrors the
        # local gate step in scripts/gates/ci-gate.ts.
        run: pnpm validate:react-floor

      - name: Boundary validation (hard fail)
        run: pnpm validate:boundary

      - name: Vercel project settings lockstep (files)
        run: pnpm validate:vercel-settings

      - name: Incubate posture (ADR-007, hard fail)
        run: pnpm validate:incubate-posture

      - name: Engines posture (ADR-006, hard fail)
        run: pnpm validate:engines-posture

      - name: Claim drift validation (hard fail)
        run: pnpm validate:claims

      - name: API docs drift
        run: pnpm validate:api-docs

      - name: Docs public mirror (hard fail)
        # ADR 2026-07-29: monorepo docs/ is SoT; fail if leftover generated
        # apps/docs/public/**/*.md reappear (except docs-pro). Mirrors local
        # gate step in scripts/gates/ci-gate.ts (fleet-redundancy C12).
        run: pnpm validate:docs-public-mirror

      - name: Claims evidence validation (hard fail)
        # Every prose sentence in covered marketing content must carry a
        # claims-evidence entry citing the code that proves it. Sibling of
        # claim-drift (numbers); this step pins the sentences. Mirrors the
        # local gate step in scripts/gates/ci-gate.ts.
        run: pnpm validate:claims-evidence

      - name: Rules lockstep validation (hard fail)
        # The .claude config surface (rules/agents/skills) is materialized
        # from revcon profiles with a sha256 manifest; tracked copies must
        # match it exactly. Mirrors the local gate step in scripts/gates/ci-gate.ts.
        run: pnpm validate:rules-lockstep

      - name: Dockerfile deps COPY lockstep (hard fail)
        # GAP-379: server/admin deps-stage package.json COPY lists must cover
        # the pnpm --filter <app>... workspace closure. Names the exact missing
        # COPY line on failure. Worker whole-tree Dockerfiles are out of scope.
        # Mirrors the local gate step in scripts/gates/ci-gate.ts.
        run: pnpm validate:dockerfile-deps

      - name: Project manager check (path-gated hard fail)
        # GAP-406: when a PR (or push) touches .revealui or packages/harnesses,
        # hard-fail if manager.json is missing/invalid. Extends validate:structure
        # (`--manager-only`) — same checkManager primitive as
        # `revealui-harnesses manager check`. No parallel validator.
        # Unrelated PRs skip. Full structure validation still runs above and
        # includes the manager check when packages/harnesses is present.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          run_check=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(\.revealui/|packages/harnesses/)'; then
              run_check=true
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              if git diff --name-only "$BEFORE_SHA"...HEAD | grep -qE '^(\.revealui/|packages/harnesses/)'; then
                run_check=true
              fi
            else
              run_check=true
            fi
          else
            run_check=true
          fi
          if [ "$run_check" != "true" ]; then
            echo "skip: no .revealui/ or packages/harnesses/ changes"
            exit 0
          fi
          pnpm validate:structure -- --manager-only
          # GAP-421 content materialization ADR: definitions ↔ committed
          # `.revealui/content/` byte freshness (harnesses already built above).
          pnpm validate:content-freshness

      - name: Marketing voice validation (hard fail)
        run: pnpm validate:marketing-voice

      - name: Marketing voice prose-slot freshness (hard fail)
        # Source MARKETING_PROSE_SLOTS must include VES block types
        # (section/ctaSection). Dist is gitignored — when present locally the
        # same keys are required (stale dist → 422 on session.patch). Does not
        # build @revealui/contracts (needs @revealui/db; Quality has install only).
        run: pnpm validate:marketing-voice-prose-slots

      - name: Doc-currency validation (hard fail)
        # Stale-fact drift guard: docs/**/*.md + apps/marketing/**/*.md prose,
        # plus apps/marketing/app/content/**/*.ts marketing-copy string
        # literals (TypeScript AST — string literals only, no
        # identifiers/imports/comments). A baseline grandfathers the corpus
        # at seed time; CI hard-fails only on NEW (file::ruleId)
        # occurrences. Mirrors the local gate step in scripts/gates/ci-gate.ts.
        run: pnpm validate:doc-currency --mode=ci

      - name: Migration journal validation (hard fail)
        run: pnpm validate:migrations

      - name: Raw-SQL validation (hard fail)
        run: pnpm validate:raw-sql

      - name: Empty-catch validation (hard fail)
        run: pnpm validate:empty-catch

      - name: audit_log ONE DOOR validation (hard fail)
        run: pnpm validate:audit-one-door

      - name: Seed script wiring validation (hard fail)
        run: pnpm validate:seed-wiring

      - name: Changeset validation (hard fail)
        # Catches mixed ignored+non-ignored changeset frontmatter BEFORE
        # merge, instead of discovering the same rejection later in the
        # release pipeline (release.yml) on main.
        run: pnpm validate:changesets

      - name: Changelog format validation (hard fail)
        # packages/*/CHANGELOG.md are changesets-owned: changesets prepends
        # new version sections by replacing the file's FIRST newline, so a
        # leading docs-frontmatter block gets release sections injected
        # inside it (#1377 corrupted 18 of 24 package changelogs). Fails if
        # any package changelog starts with anything but its `# <package>`
        # H1, or carries stranded frontmatter keys. See
        # scripts/validate/changelog-format.ts.
        run: pnpm validate:changelogs

      - name: Docs link validation (hard fail)
        # Fails when any served doc (apps/docs/public/ after copy-docs.sh)
        # links to a relative .md target that 404s on the public site —
        # internal-excluded, missing, or outside-root. Guards against the
        # broken-link class fixed manually in #1096. See
        # apps/docs/scripts/check-links.ts.
        run: pnpm --filter docs check:links

      - name: Docs-pro visibility boundary
        # docs-app-hardening PR2: public/docs-pro/** is hand-tracked and not
        # covered by prune-non-public.mjs. Fail if any file lacks visibility
        # frontmatter or uses a NEVER_SERVE basename.
        run: pnpm --filter docs check:docs-pro-boundary

      - name: Citation gate (hard fail, validity + coverage-strict)
        # Every code-behaviour claim in gated docs must cite a source:line that
        # resolves and sits in range (VALIDITY, zero baseline), and must not add
        # a NEW uncited claim beyond the grandfathered baseline (COVERAGE, via
        # --coverage-strict, Phase 3). Mirrors the local pnpm gate citation step
        # in scripts/gates/ci-gate.ts. See CONTRIBUTING.md "Source citations".
        run: pnpm validate:citations --coverage-strict

  # ---------------------------------------------------------------------------
  # Phase 1.5: Drizzle migration apply (all branches)
  #
  # Proves that every drizzle-kit migration in packages/db/migrations applies
  # cleanly against a fresh Postgres. Catches DDL errors that validate:migrations
  # (static checks) and unit tests (PGlite) cannot: non-idempotent ADD CONSTRAINT,
  # extension prerequisites, type mismatches, out-of-band .sql files that mutate
  # prod schema without going through drizzle-kit.
  # ---------------------------------------------------------------------------
  db-migrations:
    name: Drizzle Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, ensure-ci-images]

    services:
      postgres:
        # GHCR mirror of pgvector/pgvector (GAP-428) bundles pgvector into postgres:16. Migration
        # 0000 starts with `CREATE EXTENSION IF NOT EXISTS vector`, which
        # vanilla postgres:16 cannot satisfy (extension not available).
        # drizzle-kit's TTY spinner silently eats the error, so this image
        # choice is what makes the failure surface at all.
        image: ghcr.io/revealuistudio/pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revealui_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build @revealui/db and its workspace deps (drizzle.config.ts reads from dist/)
        run: pnpm --filter '@revealui/db...' build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Apply migrations to fresh Postgres (hard fail)
        run: pnpm --filter @revealui/db db:migrate
        env:
          POSTGRES_URL: "postgresql://test:test@localhost:5432/revealui_migrations"
          DATABASE_URL: "postgresql://test:test@localhost:5432/revealui_migrations"

  # ---------------------------------------------------------------------------
  # Phase 2: Typecheck (all branches)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # 25m (not 15m): when the pnpm-store cache restore transiently misses
    # (observed 2026-06-17 — Quality hit the cache warm in the same run while
    # this job reported `reused 0`), the job falls back to a cold install of
    # ~1.3k packages. On a degraded npm registry (large binaries sharp /
    # rolldown / vercel-sdk seen at 18-30 KiB/s) that cold install alone can
    # exceed 15m and cancel the job before typecheck runs. The headroom absorbs
    # that fallback window; siblings already run 20-30m.
    timeout-minutes: 25
    needs: quality

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # turbo --affected needs merge-base with the target branch.
          # Full history ensures the merge base is always reachable.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Typecheck affected packages (PRs — hard fail)
        if: github.event_name == 'pull_request'
        # Build affected packages first so consumer typechecks resolve upstream
        # subpath exports (e.g. @revealui/ai/* -> dist/*.d.ts). Dependabot PRs run
        # without TURBO_TOKEN (GitHub withholds secrets), so the remote cache is
        # cold and a typecheck-only run can race the not-yet-emitted dep builds.
        run: |
          pnpm turbo build --affected
          pnpm turbo typecheck --affected
        env:
          SKIP_ENV_VALIDATION: "true"
          # Pin the --affected base to the PR base tip (a concrete SHA always
          # reachable via fetch-depth: 0). Without this turbo tries to resolve the
          # bare branch name and fails with "ambiguous argument 'test'", falling
          # back to a full cold-cache run that amplifies the race above.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Typecheck all packages (push — hard fail)
        if: github.event_name == 'push'
        run: pnpm typecheck:all
        env:
          SKIP_ENV_VALIDATION: "true"

  # ---------------------------------------------------------------------------
  # Phase 3a: Unit tests (all branches)
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build packages (workspace tests resolve some deps from dist/)
        run: pnpm turbo build --filter='./packages/*'
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Run unit tests (hard fail)
        run: pnpm test
        env:
          CI: "true"
          SKIP_ENV_VALIDATION: "true"

      # Root scripts/ is not a turbo workspace, so `pnpm test` does not discover
      # it. Wire the secret-path lockstep gate explicitly (no live API): asserts
      # the Vercel/Fly manifests, SECRET_PATHS, and docs/SECRETS.md all agree.
      - name: Secret-path lockstep drift gate (hard fail)
        run: pnpm validate:secret-paths
        env:
          CI: "true"
          SKIP_ENV_VALIDATION: "true"

  # ---------------------------------------------------------------------------
  # Phase 3a.1: Integration tests (all PRs + push to main — requires DB)
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, ensure-ci-images]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: ghcr.io/revealuistudio/postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revealui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build packages (required — integration tests import real dist/)
        run: pnpm --filter './packages/*' build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Run integration tests (hard fail)
        run: pnpm test:integration
        env:
          SKIP_ENV_VALIDATION: "true"
          DATABASE_URL: "postgresql://test:test@localhost:5432/revealui_test"
          POSTGRES_URL: "postgresql://test:test@localhost:5432/revealui_test"

  # ---------------------------------------------------------------------------
  # Phase 3a.5: Coverage gate (main only)
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build packages (workspace coverage tests resolve some deps from dist/)
        run: pnpm turbo build --filter='./packages/*'
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Generate coverage reports
        run: pnpm test:coverage
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Validate coverage (fail on 0% packages)
        run: pnpm coverage:check -- --fail-on-zero

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Phase 3b: Build (all branches)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # turbo --affected needs merge-base with the target branch.
          # Full history ensures the merge base is always reachable.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build affected packages (PRs — hard fail)
        if: github.event_name == 'pull_request'
        run: pnpm turbo build --affected
        env:
          SKIP_ENV_VALIDATION: "true"
          # See typecheck job: pin the --affected base to the PR base tip so turbo
          # does not fall back to a full run on "ambiguous argument 'test'".
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Build all (push to protected branches — hard fail)
        if: github.event_name == 'push'
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Validate generated types are in sync (hard fail)
        # generate.ts imports @revealui/utils/dist and reads @revealui/db/dist, so
        # build db + its workspace deps first. This previously rode on the
        # build-affected step compiling everything via the base-ref fallback; now
        # that --affected resolves correctly it can skip unaffected deps, so make
        # this step self-sufficient (mirrors the Drizzle Migrations job).
        run: |
          pnpm --filter '@revealui/db...' build
          pnpm --filter @revealui/db generate:all
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated types are out of sync. Run 'pnpm --filter @revealui/db generate:all' and commit."
            git diff --stat
            exit 1
          fi
        env:
          SKIP_ENV_VALIDATION: "true"

  # ---------------------------------------------------------------------------
  # Phase 3c: Server tsx-dev boot smoke (all branches) — GAP-401
  # ---------------------------------------------------------------------------
  # E2E smoke only starts `pnpm --filter server start` (built bundle). That left
  # `tsx watch src/index.ts` (pnpm dev:api) broken for months without CI signal.
  # This job boots the SAME entry as package.json "dev" under tsx, hits
  # /health/live, and fails the PR if the module graph cannot load.
  server-tsx-boot:
    name: Server tsx boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, ensure-ci-images]

    services:
      postgres:
        image: ghcr.io/revealuistudio/pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build server workspace deps (tsx resolves package exports to dist/)
        run: pnpm --filter 'server...' build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Apply migrations (audit_log required for boot)
        run: pnpm --filter @revealui/db db:migrate
        env:
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"
          DATABASE_URL: "postgresql://test:test@localhost:5432/smoke"

      - name: Boot server under tsx and hit /health/live
        run: pnpm smoke:server-tsx
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: "development"
          PORT: "3104"
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"
          DATABASE_URL: "postgresql://test:test@localhost:5432/smoke"

  # ---------------------------------------------------------------------------
  # Phase 4: E2E smoke tests (main only)
  # ---------------------------------------------------------------------------
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, build, ensure-ci-images]
    # PRs into test as well as main: production `next start` + the Forge
    # license gate must not wait for a promote PR to fail (see #2695).
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.base_ref == 'test'

    services:
      postgres:
        # GHCR mirror of pgvector/pgvector (GAP-428) bundles pgvector into postgres:16. The migrations
        # applied below (0000_init CREATE EXTENSION, vector(768) columns) cannot
        # run on vanilla postgres:16, same as the Drizzle Migrations job.
        image: ghcr.io/revealuistudio/pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      # The API server refuses to boot if it cannot write the audit_log table
      # (GAP-355 audit-integrity: no serving without a working audit path).
      # The smoke database starts empty, so migrate it before starting servers,
      # exactly as the Drizzle Migrations job does for its own fresh Postgres.
      # Without this the server exits at startup on a missing audit_log relation
      # and "Wait for servers" times out.
      - name: Apply migrations to the smoke database
        run: pnpm --filter @revealui/db db:migrate
        env:
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"

      # The admin server runs `next start` (NODE_ENV=production, not
      # overridable) and the GAP-338/417 audit rails are fail-closed with no
      # escape hatch: a production admin refuses to serve without a DB
      # connection env AND an Ed25519 signing key. E2E provisions the real
      # thing — an ephemeral per-run key — instead of bypassing the rail.
      - name: Generate ephemeral audit signing key (E2E only)
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/e2e-audit-key.pem
          {
            echo "REVEALUI_AUDIT_SIGNING_KEY<<E2E_KEY_EOF"
            cat /tmp/e2e-audit-key.pem
            echo "E2E_KEY_EOF"
          } >> "$GITHUB_ENV"

      # Ephemeral CI secrets (not real credentials). Admin next start is
      # production-mode and still requires the base secret trio even with
      # SKIP_ENV_VALIDATION (env-validation.ts). KEK must be 64 hex chars.
      # Server production boot also requires CORS_ORIGIN + audit signing key
      # (generated above into GITHUB_ENV as REVEALUI_AUDIT_SIGNING_KEY).
      - name: Start API server
        run: pnpm --filter server start &
        env:
          # Long-running serve() lives on the dev path in index.ts; production
          # NODE_ENV is the Vercel serverless entry (worker.ts owns Fly prod).
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: "development"
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"
          REVEALUI_SECRET: "e2e-smoke-secret-at-least-32-chars-long"
          REVEALUI_PUBLIC_SERVER_URL: "http://localhost:3004"
          REVEALUI_KEK: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      # next start forces NODE_ENV=production, so SKIP_ENV_VALIDATION does not
      # skip the Forge license gate. CI has no stamped key; opt into Free (OSS).
      - name: Start Admin server
        run: pnpm --filter admin start &
        env:
          SKIP_ENV_VALIDATION: "true"
          POSTGRES_URL: "postgresql://test:test@localhost:5432/smoke"
          REVEALUI_SECRET: "e2e-smoke-secret-at-least-32-chars-long"
          REVEALUI_PUBLIC_SERVER_URL: "http://localhost:4000"
          REVEALUI_KEK: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          REVEALUI_ALLOW_UNLICENSED_SELF_HOST: "true"

      - name: Start marketing server
        run: pnpm --filter marketing start &
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Wait for servers
        run: |
          for i in $(seq 1 80); do
            curl -sf http://localhost:3004/health/live > /dev/null 2>&1 && \
            curl -sf http://localhost:4000 > /dev/null 2>&1 && \
            curl -sf http://localhost:3000 > /dev/null 2>&1 && \
            echo "All three servers ready" && exit 0
            echo "Waiting for servers... ($i/80)"
            sleep 3
          done
          echo "::error::Servers failed to start within 240s"
          exit 1

      - name: Run E2E smoke tests
        run: npx playwright test --project=chromium e2e/smoke.e2e.ts
        env:
          CI: "true"
          SKIP_ENV_VALIDATION: "true"
          API_BASE_URL: "http://localhost:3004"
          PLAYWRIGHT_BASE_URL: "http://localhost:4000"
          MARKETING_BASE_URL: "http://localhost:3000"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Phase 5: Accessibility E2E (main only)
  # ---------------------------------------------------------------------------
  e2e-accessibility:
    name: Accessibility (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, build, ensure-ci-images]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.base_ref == 'test'

    # The admin server's GAP-338/417 audit rails are fail-closed in production
    # (`next start`): a DB connection env + signing key are boot requirements.
    # Same pgvector service + migrations as the E2E Smoke job.
    services:
      postgres:
        image: ghcr.io/revealuistudio/pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
