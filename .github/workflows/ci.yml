  # ---------------------------------------------------------------------------
  # Phase 6.5: Extended integration suite (PRs + main) — TRIAGE, not yet required
  #
  # The required "Integration Tests" job runs only @revealui/auth via
  # scripts/dev-tools/run-integration-tests.ts. The large DB-backed
  # @revealui/test integration suite (packages/test/src/integration — ~30
  # files across api/, auth/, database/, router/, sync/, services/) was
  # authored but wired into NO CI job. This job runs it against a real
  # pgvector Postgres (full schema applied) so we can see what is green
  # before promoting it to a required status check.
  #
  # Billing integration is gated on the STRIPE_SECRET_KEY (sk_test_*) repo secret.
  # RUN_INTEGRATION is set to 'true' only when that secret is present, so the
  # Stripe contract test (services/stripe.integration.test.ts) activates once a
  # test-mode key is provisioned and self-skips otherwise. This is inert until
  # then (the secret is empty pre-provisioning; fork PRs never receive secrets,
  # so they stay green). Promote to a required status check after a green
  # stability window with billing actually exercised.
  # ---------------------------------------------------------------------------
  test-integration-extended:
    name: Integration Tests (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, ensure-ci-images]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      postgres:
        # pgvector image: migration 0000 does CREATE EXTENSION vector, which
        # vanilla postgres:16 cannot satisfy (mirrors the db-migrations job).
        image: ghcr.io/revealuistudio/pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: revealui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Build packages (integration tests import real dist/)
        run: pnpm --filter './packages/*' build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Apply migrations to test Postgres (full schema)
        run: pnpm --filter @revealui/db db:migrate
        env:
          POSTGRES_URL: "postgresql://test:test@localhost:5432/revealui_test"
          DATABASE_URL: "postgresql://test:test@localhost:5432/revealui_test"

      # NOTE: packages/test's manifest name is the unscoped "test" (not
      # "@revealui/test"). `--filter @revealui/test` matches zero packages and
      # pnpm exits 0 — a false green. Filter by the real name. (Caught by the
      # first CI run on this PR: "No projects matched the filters".)
      - name: Run packages/test integration suite
        run: pnpm --filter test run test:integration
        env:
          SKIP_ENV_VALIDATION: "true"
          DATABASE_URL: "postgresql://test:test@localhost:5432/revealui_test"
          POSTGRES_URL: "postgresql://test:test@localhost:5432/revealui_test"
          # Billing integration self-activates only when the test-mode key secret is set.
          RUN_INTEGRATION: ${{ secrets.STRIPE_SECRET_KEY != '' && 'true' || 'false' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

  # ---------------------------------------------------------------------------
  # CI Feedback — notify harness daemon of CI results
  # ---------------------------------------------------------------------------
  ci-feedback:
    name: CI Feedback
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [quality, typecheck, test-unit, db-migrations, build]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Determine CI result
        id: result
        run: |
          if [[ "${{ needs.quality.result }}" == "failure" ]]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "failed_job=quality" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.typecheck.result }}" == "failure" ]]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "failed_job=typecheck" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.test-unit.result }}" == "failure" ]]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "failed_job=test-unit" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.db-migrations.result }}" == "failure" ]]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "failed_job=db-migrations" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "failed_job=build" >> "$GITHUB_OUTPUT"
          else
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "failed_job=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to harness daemon
        # Defense-in-depth: only same-repo PRs with a configured gateway reach this step (fork PRs never do).
        if: vars.HARNESS_GATEWAY_URL != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        # github.head_ref is attacker-controlled on PRs. All ${{ }} values flow through env (never
        # interpolated into the shell) and jq encodes them into JSON — so no value can break out and
        # inject shell.
        env:
          GATEWAY_URL: ${{ vars.HARNESS_GATEWAY_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          CI_SUCCESS: ${{ steps.result.outputs.success }}
          FAILED_JOB: ${{ steps.result.outputs.failed_job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload="$(jq -n \
            --argjson prNumber "${PR_NUMBER:-0}" \
            --arg branch "$HEAD_REF" \
            --argjson success "${CI_SUCCESS:-false}" \
            --arg failedJob "$FAILED_JOB" \
            --arg runUrl "$RUN_URL" \
            '{jsonrpc: "2.0", id: 1, method: "ci.report", params: {prNumber: $prNumber, branch: $branch, success: $success, failedJob: $failedJob, runUrl: $runUrl}}')"
          curl -sf --max-time 10 -X POST "$GATEWAY_URL/rpc" \
            -H "Content-Type: application/json" \
            -d "$payload"
