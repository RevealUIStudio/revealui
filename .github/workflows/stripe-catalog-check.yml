name: Stripe Catalog Check

# Read-only live-catalog drift gate. NOT a per-PR gate (live API + secrets are a
# PR-gate anti-pattern) -- runs on a schedule + manual dispatch. Reports orphan /
# duplicate / missing / amount-mismatch drift between the LIVE Stripe catalog and
# the declared scripts/setup/stripe-catalog.ts. Requires a READ-ONLY Stripe key
# in the STRIPE_CATALOG_CHECK_KEY secret (products.list is enough; balance_read
# is not required). The job no-ops (passes) when unset.

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  PNPM_INSTALL_FLAGS: "--frozen-lockfile"

jobs:
  catalog-check:
    name: Stripe catalog drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_CATALOG_CHECK_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install ${{ env.PNPM_INSTALL_FLAGS }}

      - name: Catalog drift check (read-only)
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_CATALOG_CHECK_KEY not set; skipping live catalog check."
            exit 0
          fi
          pnpm stripe:catalog:check
