name: Backflow merge-commit policy

# Soft dual-method policy (option 1): feature→test may still squash; backflow
# main→test must use Create a merge commit. GitHub cannot set a per-PR-class
# UI default, so this workflow:
#   - On PRs into test: fail hand-rolled backflow PRs until label
#     backflow:merge-commit is applied, and print merge-commit-only UI/CLI
#     instructions. The configured backflow App on
#     chore/backflow-main-into-test passes without that label.
#   - On push to test: fail if origin/main is not an ancestor of HEAD (catches
#     a squash-merged backflow after the fact).
#
# Safe to mark "Backflow merge-commit policy" required on test: non-backflow
# PRs always exit 0 (the job always runs; it does not skip).

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [test]

permissions:
  contents: read
  pull-requests: read

jobs:
  backflow-merge-method:
    name: Backflow merge-commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ancestry reads git HEAD. That checkout is the pushed commit. The
      # decision script is a separate checkout: the pull request base, or the
      # previous tip on push, so the commit under test cannot rewrite the guard.
      - name: Checkout push tip for ancestry
        if: github.event_name == 'push'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted guard
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && github.sha || github.event.before) }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/validate/backflow-merge-method-guard.cjs
          sparse-checkout-cone-mode: false
          path: trusted-guard

      - name: PR mode — backflow acknowledgment + instructions
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          # Canonical App identity confirmed by its owner after the App rename.
          # Keep this policy with the guard; no per-repository variable required.
          REVEALFLEET_BACKFLOW_APP_LOGIN: revealfleet-backflow[bot]
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node trusted-guard/scripts/validate/backflow-merge-method-guard.cjs --mode=pr

      - name: Ancestry mode — test must contain main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main --depth=200
          node trusted-guard/scripts/validate/backflow-merge-method-guard.cjs --mode=ancestry
