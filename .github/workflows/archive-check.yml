name: Archive Check

# GAP-451. Docs archived out of this repo into the central fleet archive must
# leave no live inbound links behind. Until now only the private coordination
# repo enforced this, so links could rot here — the one repo where a dead link
# is externally visible.
#
# Runs with NO secret and NO access to the archive repo: the scan needs only
# the list of paths archived out of THIS repo (scripts/validate/
# archived-paths.json), which are this repo's own former paths. That is what
# makes the gate work on fork PRs, where secrets are unavailable and a
# token-based check would silently no-op.
#
# The matching logic is shared with the coordination repo's checker via
# @revealui/harnesses (packages/harnesses/src/gates/archive-check.ts), so the
# two cannot drift.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  schedule:
    # Daily. The manifest can fall behind the real archive, and the
    # coordination repo's authoritative checker catches that separately.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"

concurrency:
  group: archive-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  archive-check:
    name: Archive Check
    runs-on: ubuntu-latest
    # Headroom over the scoped install + build. The first version of this
    # workflow set 10 with an unscoped install and was cancelled at the limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # SCOPED install, not a full monorepo one. This gate needs exactly one
      # package built; installing all 27 workspaces cold took over 10 minutes
      # and hit the job timeout before the check ever ran, turning this gate
      # into a red X on unrelated PRs. Same shape as security-review-gate.yml,
      # which is the other lightweight gate job in this repo.
      - name: Install (harnesses only)
        run: pnpm install --frozen-lockfile --filter @revealui/harnesses

      # The gate fails closed if it cannot resolve the shared module, so the
      # build is a hard prerequisite rather than an optimization.
      - name: Build the shared gates module
        run: pnpm --filter @revealui/harnesses build

      # jv#871: a gate is not wired until CI has observed it green AND red.
      # Seeding a violation into the repo cannot prove the red half, because
      # this gate also runs in the local pre-push gate and correctly refuses
      # the push first. So it proves itself against a fixture, every run.
      - name: Self-test — the gate must FIRE on a seeded violation
        run: |
          fixture="$RUNNER_TEMP/archive-gate-fixture"
          mkdir -p "$fixture/docs"
          printf '[stale](docs/architecture/ADR-002-dual-database.md)\n' > "$fixture/docs/seed.md"
          if node scripts/validate/archive-check.cjs --ci --root "$fixture"; then
            echo "::error::archive-check did NOT fire on a seeded dead link — the gate is not actually checking anything"
            exit 1
          fi
          echo "OK — gate fired on the seeded violation."

      - name: Self-test — the gate must PASS on a clean fixture
        run: |
          clean="$RUNNER_TEMP/archive-gate-clean"
          mkdir -p "$clean/docs"
          printf 'no archived links here\n' > "$clean/docs/fine.md"
          node scripts/validate/archive-check.cjs --ci --root "$clean"

      - name: Check for dead inbound links to archived docs
        run: node scripts/validate/archive-check.cjs --ci
